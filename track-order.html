<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khazaana Premium Tracking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
background:linear-gradient(180deg,#0f0b08,#16110d,#1b140f,#120d09);
color:#fff;padding:20px;min-height:100vh
}
.container{max-width:950px;margin:auto}
.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:24px;
margin-bottom:20px;
box-shadow:0 15px 40px rgba(0,0,0,.35)
}
.hero{text-align:center}
.hero h1{font-size:42px;color:#ffb347}
.badge{
display:inline-block;
padding:12px 22px;
border-radius:999px;
padding:10px 24px;
font-weight:700;
margin-top:12px
}
.ring{
width:180px;height:180px;border-radius:50%;
margin:20px auto;
display:flex;align-items:center;justify-content:center;
background:conic-gradient(#ff7a00 var(--p),rgba(255,255,255,.08) 0);
}
.ring-inner{
width:140px;height:140px;border-radius:50%;
background:#120d09;display:flex;align-items:center;justify-content:center;
font-size:32px;font-weight:800;color:#ffb347
}
.step{
margin:14px 0;padding:18px;border-left:4px solid rgba(255,255,255,.15);
opacity:.4;transition:.3s;border-radius:12px
}
.step.active{
opacity:1;
background:rgba(255,122,0,.12);
border-left-color:#ff7a00
}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.total{
font-size:28px;
color:#ffb347;
margin-top:20px;
font-weight:800;
text-align:right;
}
.btn{
display:inline-block;padding:14px 22px;border-radius:16px;
background:linear-gradient(135deg,#ff7a00,#ff5400);
color:white;text-decoration:none;font-weight:700
}
.center{text-align:center}
.confetti{font-size:60px;animation:pop 1s infinite alternate}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.15)}}

.floating-support{
display:flex;
justify-content:center;
gap:25px;
margin:18px 0;
}

.support-icon{
width:65px;
height:65px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
position:relative;
overflow:hidden;
animation:float 2s ease-in-out infinite;
}

.support-text{
    text-align:center;
    color:#ffffff;
    font-size:12px;
    margin-top:8px;
    opacity:0.9;
    font-weight:500;
}

.call{
    background:rgba(20,20,20,0.95);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.08),
        0 8px 25px rgba(0,0,0,0.4);
}

.support-label{
    display:inline-block;
    margin-top:14px;
    padding:8px 18px;

    border-radius:30px;

    background:linear-gradient(
        135deg,
        rgba(255,140,0,0.15),
        rgba(255,179,71,0.08)
    );

    border:1px solid rgba(255,179,71,.18);

    color:#ffcf7a;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;

   box-shadow:
    0 0 20px rgba(255,140,0,.12);
}

.home-btn{
display:inline-block;
margin-top:20px;
padding:14px 28px;
border-radius:16px;

background:linear-gradient(
135deg,
#ff9a1f,
#ff6b00
);

color:white;
text-decoration:none;
font-weight:700;
font-size:16px;

box-shadow:
0 8px 25px rgba(255,122,0,.3);

transition:.3s;
}

.home-btn:hover{
transform:translateY(-3px);
}

.whatsapp{
background:linear-gradient(135deg,#25D366,#1faa52);
box-shadow:0 0 15px rgba(37,211,102,.7),
0 0 35px rgba(37,211,102,.5);
}

.support-icon:hover{
transform:scale(1.15);
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-6px);
}
}

0%,100%{
transform:rotate(0deg);
}

25%{
transform:rotate(-4deg);
}

75%{
transform:rotate(4deg);
}

}
}

</style>
</head>
<body>
<div class="container">

<div class="card hero">
<h1>🍽️ Order Tracking</h1>
<div id="status" class="badge">Loading...</div>
<div class="floating-support">

<a
href="tel:8695902696"
class="support-icon call">

📞

</a>

<a
href="https://wa.me/918695902696"
target="_blank"
class="support-icon whatsapp">

<svg width="34" height="34" viewBox="0 0 32 32" fill="white">
<path d="M16.04 5.33c-5.89 0-10.67 4.77-10.67 10.66 0 1.88.49 3.72 1.42 5.34L5 27l5.84-1.53a10.64 10.64 0 0 0 5.2 1.33c5.89 0 10.66-4.77 10.66-10.67S21.93 5.33 16.04 5.33zm0 19.37c-1.63 0-3.22-.44-4.61-1.28l-.33-.2-3.46.91.92-3.37-.22-.35a8.61 8.61 0 1 1 7.7 4.29zm4.72-6.45c-.26-.13-1.55-.76-1.79-.85-.24-.09-.41-.13-.59.13-.17.26-.67.85-.82 1.03-.15.18-.3.2-.56.07-.26-.13-1.08-.4-2.06-1.28-.76-.67-1.27-1.5-1.42-1.75-.15-.26-.02-.39.11-.52.11-.11.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.33-.02-.46-.07-.13-.59-1.43-.81-1.96-.21-.5-.42-.43-.59-.44h-.5c-.17 0-.46.06-.7.33-.24.26-.92.9-.92 2.19 0 1.29.94 2.53 1.07 2.71.13.17 1.85 2.82 4.48 3.95.63.27 1.12.43 1.5.55.63.2 1.21.17 1.67.1.51-.08 1.55-.63 1.77-1.24.22-.61.22-1.13.15-1.24-.06-.11-.24-.17-.5-.3z"/>
</svg>

</a>

</div>

<div class="support-label">
    Contact for Support
</div>

<div class="ring" id="ring" style="--p:25%">
<div class="ring-inner" id="percent">25%</div>
</div>

<div class="card">
<h2>Live Progress</h2>
<div id="s1" class="step">✅ Order Confirmed</div>
<div id="s2" class="step">👨‍🍳 Preparing Your Food</div>
<div id="s3" class="step">🛵 Rider On The Way</div>
<div id="s4" class="step">🎉 Delivered</div>
</div>

<div class="card">
<h2>Order Summary</h2>
<div id="items">Loading...</div>
<div class="total">Total: ₹<span id="total">0</span></div>
</div>

<div class="card center">
<div id="celebrate"></div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyB_UipI_NKsbMWrmqCh26t_L7lBbRRw3GE",
authDomain:"khazaana-7088c.firebaseapp.com",
projectId:"khazaana-7088c",
storageBucket:"khazaana-7088c.firebasestorage.app",
messagingSenderId:"988898941531",
appId:"1:988898941531:web:851a3d3db24c85e9fa3d7e"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const orderId=new URLSearchParams(location.search).get("id");

function activate(level){
for(let i=1;i<=4;i++){
document.getElementById("s"+i).classList.remove("active");
}
for(let i=1;i<=level;i++){
document.getElementById("s"+i).classList.add("active");
}
}

onSnapshot(doc(db,"orders",orderId),(snap)=>{

console.log("ORDER ID:", orderId);

if(!snap.exists()){
    console.log("ORDER NOT FOUND");
    return;
}

console.log("SNAPSHOT RECEIVED");

if(!snap.exists()) return;

const d=snap.data();

console.log("STATUS =", d.status);

let level=1,p=25;

if(d.status==="Pending"){
level=1;
p=25;
}

if(d.status==="Accepted"){
level=2;
p=50;
}

if(d.status==="Out For Delivery"){
level=3;
p=75;
}

if(d.status==="Delivered"){
level=4;
p=100;
}

activate(level);

document.getElementById("ring")
.style.setProperty("--p", p + "%");

document.getElementById("percent")
.innerText = p + "%";

document.getElementById("status")
.innerText = d.status;

let html="";

(d.items || []).forEach(i=>{
html += `
<div class="row">
<span>${i.name} ×${i.qty}</span>
<span>₹${i.total}</span>
</div>
`;
});

const subtotal = d.subtotal || 0;
const delivery = d.delivery || 0;
const coupon = d.coupon || "None";

let discountAmount = 0;

if(coupon === "KHAZAANA5"){
discountAmount = Math.round(subtotal * 0.05);
}

if(coupon === "CUPSNCRUMBSCAFE10"){
discountAmount = Math.round(subtotal * 0.10);
}

html += `

<div style="height:18px"></div>

<div class="row">
<span>Subtotal</span>
<span>₹${subtotal}</span>
</div>

<div class="row">
<span>Delivery Fee</span>
<span>${delivery === 0 ? "FREE" : "₹" + delivery}</span>
</div>

<div class="row">
<span>Coupon Applied</span>
<span style="color:#ffb347;font-weight:700">
${coupon}
</span>
</div>

<div class="row">
<span>Discount</span>
<span style="color:#25D366;font-weight:700">
-₹${discountAmount}
</span>
</div>

`;

document.getElementById("items").innerHTML = html;
document.getElementById("total").innerText = d.total || 0;

if(d.status==="Delivered"){
document.getElementById("celebrate").innerHTML = `
<div class="confetti">🎉🎊✨</div>

<div style="
margin-top:20px;
font-size:20px;
font-weight:700;
color:#ffb347;
">
Thank you for ordering from Khazaana ❤️
</div>

<a href="index.html" class="home-btn">
🏠 Go Home
</a>
`;

}

});
</script>
</body>
</html>
