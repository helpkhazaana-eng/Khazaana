<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bondhu Hotel & Restaurant | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon-180x180.png">

<style>

/* =========================================================
   KHAZAANA × BONDHU HOTEL & RESTAURANT
   PREMIUM MOSS × WHEAT EDITORIAL THEME
   Visual styling only — menu/order logic preserved.
   ========================================================= */

:root{
  --moss:#2D3A2F;
  --wheat:#D3C6B6;
  --wheat-light:#E2D8CB;
  --line:rgba(45,58,47,.16);
  --white:#F8F5EF;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
}

html{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  scroll-behavior:smooth;
}

body{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:hidden;
  background:var(--wheat);
  color:var(--moss);
  padding-bottom:145px;
}

/* ================= NAVBAR ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  width:100%;
  background:rgba(45,58,47,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(211,198,182,.18);
  box-shadow:0 12px 35px rgba(45,58,47,.15);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:600;
  letter-spacing:.5px;
  color:var(--wheat-light);
}

.nav a{
  position:relative;
  text-decoration:none;
  margin-left:28px;
  color:rgba(226,216,203,.72);
  font-size:13px;
  font-weight:600;
  transition:.3s ease;
}

.nav a:hover{
  color:var(--wheat-light);
}

.nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-8px;
  width:0;
  height:1px;
  background:var(--wheat-light);
  transition:.35s ease;
}

.nav a:hover::after{
  width:100%;
}

/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:78px 20px 62px;
  position:relative;
  background:var(--wheat);
  color:var(--moss);
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:none;
  pointer-events:none;
}

.hero h1{
  position:relative;
  z-index:2;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(40px,6vw,68px);
  font-weight:400;
  letter-spacing:-2px;
  line-height:1;
  margin-bottom:18px;
  color:var(--moss);
}

.hero p{
  position:relative;
  z-index:2;
  color:rgba(45,58,47,.62);
  font-size:15px;
  letter-spacing:1.5px;
}

#statusMsg{
  margin-top:16px;
  font-weight:700;
  font-size:13px;
  color:var(--moss);
}

/* ================= MENU ================= */

.menu{
  max-width:1300px;
  margin:auto;
  padding:25px 24px 90px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:22px;
  background:var(--wheat);
}

/* ================= SECTION ================= */

.section{
  background:var(--moss);
  border:1px solid rgba(211,198,182,.14);
  border-radius:0;
  padding:28px;
  box-shadow:0 18px 45px rgba(45,58,47,.12);
  transition:.3s ease;
}

.section:hover{
  transform:translateY(-4px);
  box-shadow:0 25px 55px rgba(45,58,47,.17);
}

.section h2{
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:400;
  letter-spacing:.2px;
  margin-bottom:18px;
  color:var(--wheat-light);
}

/* ================= ITEM ================= */

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid rgba(211,198,182,.14);
}

.item:last-child{
  border-bottom:none;
}

.item span{
  color:rgba(226,216,203,.9);
  font-size:14px;
  line-height:1.5;
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.btn{
  width:32px;
  height:32px;
  border:none;
  border-radius:50%;
  background:var(--wheat-light);
  color:var(--moss);
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  transition:.25s ease;
}

.btn:hover{
  transform:scale(1.08);
  background:#EFE8DE;
}

.qty{
  min-width:24px;
  text-align:center;
  font-weight:700;
  color:var(--wheat-light);
}

/* ================= CART ================= */

.cart-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:rgba(45,58,47,.97);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(211,198,182,.18);
  box-shadow:0 -12px 35px rgba(45,58,47,.20);
  padding:16px 20px;
  z-index:1000;
}

.cart-info{
  font-size:14px;
  margin-bottom:10px;
  color:rgba(226,216,203,.7);
  text-align:center;
}

.cart-info b{
  color:var(--wheat-light);
}

.order-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:2px;
  background:var(--wheat-light);
  color:var(--moss);
  font-size:15px;
  font-weight:800;
  letter-spacing:.5px;
  cursor:pointer;
  transition:.3s ease;
}

.order-btn:hover{
  transform:translateY(-2px);
  background:#EFE8DE;
}

.note{
  font-size:11px;
  color:rgba(226,216,203,.48);
  text-align:center;
  margin-top:8px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  header{
    position:fixed;
    width:100%;
  }

  .nav{
    padding:14px 18px;
  }

  .logo{
    font-size:20px;
  }

  .nav a{
    margin-left:16px;
    font-size:11px;
  }

  .hero{
    padding:112px 20px 42px;
  }

  .hero h1{
    font-size:40px;
    line-height:1.05;
  }

  .hero p{
    font-size:13px;
  }

  .menu{
    grid-template-columns:1fr;
    padding:20px 16px 90px;
    gap:16px;
  }

  .section{
    padding:20px;
  }

  .section h2{
    font-size:21px;
  }

  .item span{
    font-size:13px;
  }

  .btn{
    width:30px;
    height:30px;
  }
}

/* ================= HORIZONTAL STABILITY ================= */

img,svg,video,iframe,canvas{
  max-width:100%;
}

header,section,main,footer,nav,
.menu,.section,.item,.cart-bar{
  min-width:0;
  max-width:100%;
}

@media(max-width:768px){
  html,body{
    width:100%;
    max-width:100vw;
    overflow-x:hidden !important;
  }

  .menu{
    width:100%;
    max-width:100%;
  }
}


/* ================= CHECKOUT SAVINGS POPUP ================= */
.checkout-overlay{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(45,58,47,.58);backdrop-filter:blur(10px);
}
.checkout-overlay.show{display:flex}
.checkout-popup{
  width:min(430px,100%);padding:28px;
  background:var(--moss);color:var(--wheat-light);
  border:1px solid rgba(211,198,182,.22);border-radius:16px;
  box-shadow:0 30px 90px rgba(45,58,47,.35);
}
.checkout-popup h3{
  margin:0 0 7px;font-family:Georgia,"Times New Roman",serif;
  font-size:27px;font-weight:400;color:var(--wheat-light);
}
.checkout-popup-sub{margin-bottom:20px;color:rgba(226,216,203,.65);font-size:13px}
.checkout-save{
  padding:15px;margin:10px 0;border:1px solid rgba(211,198,182,.13);
  border-radius:12px;background:rgba(211,198,182,.055);
}
.checkout-save.unlocked{border-color:rgba(211,198,182,.30);background:rgba(211,198,182,.10)}
.checkout-save .save-title{font-weight:800;font-size:15px}
.checkout-save .save-detail{margin-top:5px;font-size:12px;color:rgba(226,216,203,.62)}
.checkout-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.checkout-actions button{
  min-height:48px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;
}
.checkout-add-more{border:1px solid rgba(211,198,182,.28);background:transparent;color:var(--wheat-light)}
.checkout-continue{border:0;background:var(--wheat-light);color:var(--moss)}
@media(max-width:480px){
  .checkout-popup{padding:23px}
  .checkout-actions{grid-template-columns:1fr}
}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
Khazaana
</div>

<div>
<a href="index.html">Home</a>
<a href="restaurants.html">Restaurants</a>
</div>

</div>

</header>

<section class="hero">

<h1>
Bondhu Hotel & Restaurant
</h1>

<p>
Hotel • Restaurant • Meals
</p>

<p id="statusMsg"></p>

</section>

<section class="menu" id="menu"></section>

<div class="cart-bar">

<div class="cart-info">
Subtotal: ₹0 | Delivery: ₹30 | <b>Total: ₹0</b>
</div>

<button class="order-btn"
onclick="goToCheckout()">

Proceed to Checkout

</button>

<div class="note">
Minimum order ₹100 (excluding delivery)
</div>

</div>


<!-- CHECKOUT SAVINGS DECISION -->
<div class="checkout-overlay" id="checkoutOverlay" onclick="closeCheckoutPopup(event)">
  <div class="checkout-popup" role="dialog" aria-modal="true">
    <h3>Before you checkout…</h3>
    <div class="checkout-popup-sub">Your Bondhu order can still unlock extra savings.</div>

    <div class="checkout-save" id="freeDeliverySave">
      <div class="save-title" id="freeDeliveryTitle"></div>
      <div class="save-detail" id="freeDeliveryDetail"></div>
    </div>

    <div class="checkout-save" id="couponSave">
      <div class="save-title" id="couponTitle"></div>
      <div class="save-detail" id="couponDetail"></div>
    </div>

    <div class="checkout-actions">
      <button class="checkout-add-more" onclick="addMoreFromPopup()">＋ Add More</button>
      <button class="checkout-continue" onclick="continueToCheckout()">Continue to Checkout →</button>
    </div>
  </div>
</div>

<script>

const DELIVERY = 30;
const FREE_DELIVERY_ABOVE = 450;
const MIN_ORDER = 100;

const menuData = {

  "☕ Beverages": [
    ["Tea",20],
    ["Coffee",40],
    ["Lassi",65],
    ["Cold Coffee",90],
    ["Mineral Water",25]
  ],

  "🍜 Easy Bites": [
    ["Chicken Chowmein",125],
    ["Egg Chowmein",115],
    ["Veg Chowmein",100],
    ["Veg Pakora",165],
    ["Onion Pakora",165],
    ["Egg Omelet",50],
    ["Egg Bhurji",50],
    ["Egg Roll",50],
    ["Chicken Roll",125]
  ],

  "🥘 Parathas & Soups": [
    ["Aloo Paratha",75],
    ["Mix Veg Paratha",165],
    ["Paneer Paratha",115],
    ["Plain Paratha",25],
    ["Mix Soup",175],
    ["Chicken Soup",150],
    ["Veg Soup",125]
  ],

  "🍗 Non-Veg Appetizers": [
    ["Fish Finger",275],
    ["Tandoori Chicken (Full)",575],
    ["Tandoori Chicken (Half)",315],
    ["Chicken Tikka",315],
    ["Chicken Lollipop",265],
    ["Chicken Stick",275]
  ],

  "🍞 Breads": [
    ["Tawa Roti",10],
    ["Ghee Tawa Roti",20],
    ["Tandoori Roti",20],
    ["Butter Tandoori Roti",40],
    ["Butter Naan",65],
    ["Garlic Naan",90],
    ["Rumali Roti",50],
    ["Masala Kuleba",115]
  ],

  "🍛 Non-Veg Main Course": [
    ["Chicken Curry",200],
    ["Chicken Dopiaza",250],
    ["Chicken Kolhapuri",250],
    ["Chicken Masala",250],
    ["Chicken Handi",275],
    ["Chicken Tikka Masala",340],
    ["Chili Chicken",215],
    ["Chicken Varta",215]
  ],

  "🍽 Thali": [
    ["Veg Thali",75],
    ["Veg Thali (Basmati)",140],
    ["Fish Thali",100],
    ["Chicken Thali",190],
    ["Egg Thali",90],
    ["Mutton Thali",275]
  ],

  "🥗 Veg Side Dish": [
    ["Green Salad",75],
    ["Chana Masala",125],
    ["Chana Paneer",225],
    ["Paneer Butter Masala",215],
    ["Chili Paneer",215],
    ["Mix Veg",125],
    ["Daal Fry",125],
    ["Aloo Dum",125],
    ["Kadhai Paneer",215]
  ],

  "🍳 Tadka": [
    ["Plain Tadka",75],
    ["Egg Butter Tadka",90],
    ["Egg Tadka",80],
    ["Mutton Butter Tadka",250],
    ["Chicken Butter Tadka",165]
  ],

  "🍟 Snacks": [
    ["Chicken Fry",115],
    ["Boiled Chana",100],
    ["Rice Chicken",275],
    ["Chicken Kurkure",275],
    ["Chicken Tandoori Masala (2 Pc)",450],
    ["Chicken Tandoori Masala (4 Pc)",900],
    ["Chicken Butter Masala",225]
  ],

  "🍚 Biryani & Rice": [
    ["Chicken Biryani",125],
    ["Chicken Biryani (Special)",165],
    ["Mutton Biryani",215],
    ["Chicken Fried Rice",175],
    ["Veg Fried Rice",150],
    ["Mix Fried Rice",215],
    ["Egg Fried Rice",165],
    ["Egg Biryani",115],
    ["Veg Biryani",125]
  ]

};

const cart = {};

function renderMenu(){

const menu =
document.getElementById("menu");

for(const section in menuData){

let html =
`<div class="section">

<h2>${section}</h2>`;

menuData[section].forEach(([name,price],i)=>{

const id =
section.replace(/\W/g,'')+i;

cart[id] = {
name,
price,
qty:0
};

html += `
<div class="item">

<span>
${name} ₹${price}
</span>

<div class="controls">

<button class="btn"
onclick="updateQty('${id}',-1)">
−
</button>

<span class="qty"
id="q-${id}">
0
</span>

<button class="btn"
onclick="updateQty('${id}',1)">
+
</button>

</div>

</div>`;
});

html += `</div>`;

menu.innerHTML += html;
}
}

renderMenu();

if(typeof gtag === "function"){
  gtag('event','menu_view',{
    restaurant:'Bondhu Restaurant'
  });
}

function updateQty(id,change){

if(change > 0){

  if(typeof gtag === "function"){
    gtag('event','add_to_cart',{
      restaurant:'Bondhu Restaurant'
    });
  }

  if(window.trackAddToCart){
    window.trackAddToCart();
  }

}

cart[id].qty =
Math.max(0,cart[id].qty+change);

document.getElementById(
"q-"+id
).innerText = cart[id].qty;

updateTotals();
}

function updateTotals(){

let subtotal = 0;

for(const i in cart){

subtotal +=
cart[i].qty * cart[i].price;
}

const deliveryCharge =
subtotal >= FREE_DELIVERY_ABOVE
? 0
: DELIVERY;

const total =
subtotal > 0
? subtotal + deliveryCharge
: 0;

document.querySelector(
".cart-info"
).innerHTML =

`Subtotal: ₹${subtotal}
| Delivery:
${deliveryCharge === 0
? "FREE"
: "₹"+DELIVERY}
| <b>Total: ₹${total}</b>`;
}

function getCurrentSubtotal(){
  let subtotal = 0;
  for(const id in cart){
    subtotal += cart[id].qty * cart[id].price;
  }
  return subtotal;
}

function openCheckoutPopup(){
  const subtotal = getCurrentSubtotal();

  /* Bondhu: FREE DELIVERY at ₹450 */
  const freeDeliveryThreshold = FREE_DELIVERY_ABOVE;

  /* Common Khazaana coupon: KHAZAANA5 at ₹350 for 5% OFF */
  const couponThreshold = 350;

  const freeBox = document.getElementById("freeDeliverySave");
  const freeTitle = document.getElementById("freeDeliveryTitle");
  const freeDetail = document.getElementById("freeDeliveryDetail");
  const couponBox = document.getElementById("couponSave");
  const couponTitle = document.getElementById("couponTitle");
  const couponDetail = document.getElementById("couponDetail");

  if(subtotal >= freeDeliveryThreshold){
    freeBox.classList.add("unlocked");
    freeTitle.innerText = "✓ FREE DELIVERY UNLOCKED";
    freeDetail.innerText = "Your Bondhu order already qualifies for free delivery.";
  }else{
    freeBox.classList.remove("unlocked");
    freeTitle.innerText =
      "🚚 Add ₹" + (freeDeliveryThreshold - subtotal) + " more for FREE DELIVERY";
    freeDetail.innerText = "Free delivery starts at ₹450.";
  }

  if(subtotal >= couponThreshold){
    couponBox.classList.add("unlocked");
    couponTitle.innerText = "✓ KHAZAANA5 UNLOCKED";
    couponDetail.innerText = "Apply KHAZAANA5 in checkout for 5% OFF.";
  }else{
    couponBox.classList.remove("unlocked");
    couponTitle.innerText =
      "🎁 Add ₹" + (couponThreshold - subtotal) + " more for KHAZAANA5";
    couponDetail.innerText = "Reach ₹350 to unlock 5% OFF.";
  }

  document.getElementById("checkoutOverlay").classList.add("show");
}

function closeCheckoutPopup(event){
  if(event && event.target !== document.getElementById("checkoutOverlay")) return;
  document.getElementById("checkoutOverlay").classList.remove("show");
}

function addMoreFromPopup(){
  /* Stay on the same Bondhu menu and keep the cart untouched. */
  document.getElementById("checkoutOverlay").classList.remove("show");
}

function continueToCheckout(){
  const selectedItems = [];
  let subtotal = 0;

  for(const id in cart){
    if(cart[id].qty > 0){
      const itemTotal = cart[id].price * cart[id].qty;

      selectedItems.push({
        name: cart[id].name,
        qty: cart[id].qty,
        total: itemTotal
      });

      subtotal += itemTotal;
    }
  }

  const delivery = subtotal >= FREE_DELIVERY_ABOVE ? 0 : DELIVERY;
  const total = subtotal + delivery;

  const order = {
    restaurant: "Bondhu Hotel & Restaurant",
    items: selectedItems,
    subtotal: subtotal,
    delivery: delivery,
    total: total
  };

  localStorage.removeItem("khazaanaOrder");
  localStorage.setItem("khazaanaOrder", JSON.stringify(order));
  window.location.href = "checkout.html";
}

function goToCheckout(){
  const subtotal = getCurrentSubtotal();

  if(subtotal < MIN_ORDER){
    alert(`Minimum order is ₹${MIN_ORDER}`);
    return;
  }

  openCheckoutPopup();
}

function toggleCart(disable){

const buttons =
document.querySelectorAll("button");

buttons.forEach(btn=>{

if(
btn.innerText.trim()==="+" ||
btn.innerText.trim()==="−"
){

btn.disabled = disable;

btn.style.opacity =
disable ? "0.5" : "1";

btn.style.cursor =
disable
? "not-allowed"
: "pointer";
}
});

const checkoutBtn =
document.querySelector(".order-btn");

checkoutBtn.disabled =
disable;

checkoutBtn.style.opacity =
disable ? "0.5" : "1";

checkoutBtn.style.cursor =
disable
? "not-allowed"
: "pointer";
}

function isClosed(){
  return false;
}

function toggleCart(disable){
  const buttons = document.querySelectorAll("button");

  buttons.forEach(btn=>{
    if(btn.innerText.trim()==="+" || btn.innerText.trim()==="−"){
      btn.disabled = false;
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
    }
  });

  const checkoutBtn = document.querySelector(".order-btn");
  if(checkoutBtn){
    checkoutBtn.disabled = false;
    checkoutBtn.style.opacity = "1";
    checkoutBtn.style.cursor = "pointer";
  }
}

function updateStatus(){
  const msg = document.getElementById("statusMsg");

  if(msg){
    msg.innerText = "🟢 Open Now";
  }

  toggleCart(false);
}

updateStatus();

</script>

</script>
