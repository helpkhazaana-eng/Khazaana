<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bondhu Hotel & Restaurant | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon-180x180.png">

<style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

/* ================= BODY ================= */

body{

  background:

  linear-gradient(
  180deg,
  #0f0b08 0%,
  #16110d 35%,
  #1b140f 65%,
  #120d09 100%
  );

  color:#fff;

  overflow-x:hidden;

  padding-bottom:140px;
}

/* ================= NAVBAR ================= */

header{

  position:sticky;

  top:0;

  z-index:1000;

  background:
  rgba(10,10,10,.45);

  backdrop-filter:blur(18px);

  border-bottom:
  1px solid rgba(255,255,255,.06);

  box-shadow:
  0 10px 30px rgba(0,0,0,.18);
}

.nav{

  max-width:1200px;

  margin:auto;

  padding:16px 24px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:24px;

  font-weight:800;

  color:#fff;
}

.nav a{

  text-decoration:none;

  margin-left:24px;

  color:
  rgba(255,255,255,.72);

  font-weight:500;
}

/* ================= HERO ================= */

.hero{

  text-align:center;

  padding:70px 20px 50px;

  position:relative;
}

.hero::before{

  content:'';

  position:absolute;

  inset:0;

  background:

  radial-gradient(
  circle at top right,
  rgba(255,122,0,.12),
  transparent 30%
  );

  pointer-events:none;
}

.hero h1{

  position:relative;

  z-index:2;

  font-size:58px;

  font-weight:900;

  letter-spacing:-2px;

  margin-bottom:14px;

  color:#fff;
}

.hero p{

  position:relative;

  z-index:2;

  color:
  rgba(255,255,255,.72);

  font-size:17px;
}

#statusMsg{

  margin-top:12px;

  font-weight:700;

  color:#ffb347;
}

/* ================= MENU ================= */

.menu{

  max-width:1400px;

  margin:auto;

  padding:20px 24px 90px;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:28px;
}

/* ================= SECTION ================= */

.section{

  background:
  rgba(255,255,255,.06);

  border:
  1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:24px;

  box-shadow:
  0 20px 45px rgba(0,0,0,.25);

  transition:.35s ease;
}

.section:hover{

  transform:
  translateY(-8px);
}

.section h2{

  font-size:22px;

  margin-bottom:18px;

  color:#ffb347;
}

/* ================= ITEM ================= */

.item{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:12px 0;

  border-bottom:
  1px dashed rgba(255,255,255,.08);
}

.item:last-child{

  border-bottom:none;
}

.item span{

  color:#fff;

  font-size:15px;

  line-height:1.5;
}

/* ================= CONTROLS ================= */

.controls{

  display:flex;

  align-items:center;

  gap:8px;
}

.btn{

  width:30px;

  height:30px;

  border:none;

  border-radius:10px;

  background:
  linear-gradient(
  135deg,
  #ff7a00,
  #ff5400
  );

  color:#fff;

  font-size:18px;

  font-weight:700;

  cursor:pointer;
}

.qty{

  min-width:22px;

  text-align:center;

  font-weight:700;

  color:#fff;
}

/* ================= CART ================= */

.cart-bar{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  background:
  rgba(10,10,10,.92);

  backdrop-filter:blur(18px);

  border-top:
  1px solid rgba(255,255,255,.08);

  padding:16px 20px;

  z-index:1000;
}

.cart-info{

  font-size:15px;

  margin-bottom:10px;

  color:
  rgba(255,255,255,.75);
}

.cart-info b{

  color:#ffb347;
}

.order-btn{

  width:100%;

  padding:15px;

  border:none;

  border-radius:14px;

  background:
  linear-gradient(
  135deg,
  #25D366,
  #1faa52
  );

  color:#fff;

  font-size:16px;

  font-weight:800;

  cursor:pointer;
}

.note{

  font-size:12px;

  color:
  rgba(255,255,255,.5);

  text-align:center;

  margin-top:6px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  header{

    position:fixed;

    width:100%;
  }

  .nav{

    padding:14px 18px;
  }

  .hero{

    padding:120px 20px 40px;
  }

  .hero h1{

    font-size:40px;

    line-height:1.1;
  }

  .hero p{

    font-size:15px;
  }

  .menu{

    grid-template-columns:1fr;

    padding:20px 18px 90px;

    gap:22px;
  }

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
Khazaana
</div>

<div>
<a href="index.html">Home</a>
<a href="restaurants.html">Restaurants</a>
</div>

</div>

</header>

<section class="hero">

<h1>
Bondhu Hotel & Restaurant
</h1>

<p>
Hotel • Restaurant • Meals
</p>

<p id="statusMsg"></p>

</section>

<section class="menu" id="menu"></section>

<div class="cart-bar">

<div class="cart-info">
Subtotal: ₹0 | Delivery: ₹30 | <b>Total: ₹0</b>
</div>

<button class="order-btn"
onclick="goToCheckout()">

Proceed to Checkout

</button>

<div class="note">
Minimum order ₹100 (excluding delivery)
</div>

</div>

<script>

const DELIVERY = 30;
const FREE_DELIVERY_ABOVE = 350;
const MIN_ORDER = 100;

const menuData = {

  "☕ Beverages": [
    ["Tea",15],
    ["Coffee",30],
    ["Lassi",50],
    ["Cold Coffee",70],
    ["Mineral Water",20]
  ],

  "🍜 Easy Bites": [
    ["Chicken Chowmein",100],
    ["Egg Chowmein",90],
    ["Veg Chowmein",80],
    ["Veg Pakora",130],
    ["Onion Pakora",130],
    ["Egg Omelet",40],
    ["Egg Bhurji",40],
    ["Egg Roll",40],
    ["Chicken Roll",100]
  ],

  "🥘 Parathas & Soups": [
    ["Aloo Paratha",60],
    ["Mix Veg Paratha",130],
    ["Paneer Paratha",90],
    ["Plain Paratha",20],
    ["Mix Soup",140],
    ["Chicken Soup",120],
    ["Veg Soup",100]
  ],

  "🍗 Non-Veg Appetizers": [
    ["Fish Finger",220],
    ["Tandoori Chicken (Full)",460],
    ["Tandoori Chicken (Half)",250],
    ["Chicken Tikka",250],
    ["Chicken Lollipop",210],
    ["Chicken Stick",220]
  ],

  "🍞 Breads": [
    ["Tawa Roti",6],
    ["Ghee Tawa Roti",15],
    ["Tandoori Roti",15],
    ["Butter Tandoori Roti",30],
    ["Butter Naan",50],
    ["Garlic Naan",70],
    ["Rumali Roti",40],
    ["Masala Kuleba",90]
  ],

  "🍛 Non-Veg Main Course": [
    ["Chicken Curry",160],
    ["Chicken Dopiaza",200],
    ["Chicken Kolhapuri",200],
    ["Chicken Masala",200],
    ["Chicken Handi",220],
    ["Chicken Tikka Masala",270],
    ["Chili Chicken",170],
    ["Chicken Varta",170]
  ],

  "🍽 Thali": [
    ["Veg Thali",60],
    ["Veg Thali (Basmati)",110],
    ["Fish Thali",80],
    ["Chicken Thali",150],
    ["Egg Thali",70],
    ["Mutton Thali",220]
  ],

  "🥗 Veg Side Dish": [
    ["Green Salad",60],
    ["Chana Masala",100],
    ["Chana Paneer",180],
    ["Paneer Butter Masala",170],
    ["Chili Paneer",170],
    ["Mix Veg",100],
    ["Daal Fry",100],
    ["Aloo Dum",100],
    ["Kadhai Paneer",170]
  ],

  "🍳 Tadka": [
    ["Plain Tadka",60],
    ["Egg Butter Tadka",70],
    ["Egg Tadka",65],
    ["Mutton Butter Tadka",200],
    ["Chicken Butter Tadka",130]
  ],

  "🍟 Snacks": [
    ["Chicken Fry",90],
    ["Boiled Chana",80],
    ["Rice Chicken",220],
    ["Chicken Kurkure",220],
    ["Chicken Tandoori Masala (2 Pc)",360],
    ["Chicken Tandoori Masala (4 Pc)",720],
    ["Chicken Butter Masala",180]
  ],

  "🍚 Biryani & Rice": [
    ["Chicken Biryani",100],
    ["Chicken Biryani (Special)",130],
    ["Mutton Biryani",170],
    ["Chicken Fried Rice",140],
    ["Veg Fried Rice",120],
    ["Mix Fried Rice",170],
    ["Egg Fried Rice",130],
    ["Egg Biryani",90],
    ["Veg Biryani",100]
  ]

};

const cart = {};

function renderMenu(){

const menu =
document.getElementById("menu");

for(const section in menuData){

let html =
`<div class="section">

<h2>${section}</h2>`;

menuData[section].forEach(([name,price],i)=>{

const id =
section.replace(/\W/g,'')+i;

cart[id] = {
name,
price,
qty:0
};

html += `
<div class="item">

<span>
${name} ₹${price}
</span>

<div class="controls">

<button class="btn"
onclick="updateQty('${id}',-1)">
−
</button>

<span class="qty"
id="q-${id}">
0
</span>

<button class="btn"
onclick="updateQty('${id}',1)">
+
</button>

</div>

</div>`;
});

html += `</div>`;

menu.innerHTML += html;
}
}

renderMenu();

function updateQty(id,change){

if(isClosed()) return;

cart[id].qty =
Math.max(0,cart[id].qty+change);

document.getElementById(
"q-"+id
).innerText = cart[id].qty;

updateTotals();
}

function updateTotals(){

let subtotal = 0;

for(const i in cart){

subtotal +=
cart[i].qty * cart[i].price;
}

const deliveryCharge =
subtotal >= FREE_DELIVERY_ABOVE
? 0
: DELIVERY;

const total =
subtotal > 0
? subtotal + deliveryCharge
: 0;

document.querySelector(
".cart-info"
).innerHTML =

`Subtotal: ₹${subtotal}
| Delivery:
${deliveryCharge === 0
? "FREE"
: "₹"+DELIVERY}
| <b>Total: ₹${total}</b>`;
}

function goToCheckout(){

if(isClosed()){

alert(
"Restaurant is currently closed"
);

return;
}

let subtotal = 0;

for(const i in cart){

subtotal +=
cart[i].qty * cart[i].price;
}

if(subtotal < MIN_ORDER){

alert(
`Minimum order is ₹${MIN_ORDER}`
);

return;
}

window.location.href =
"checkout.html";
}

/* ===== STATUS ===== */

function isClosed(){

const h =
new Date().getHours();

return(h >= 21 || h < 10);
}

function toggleCart(disable){

const buttons =
document.querySelectorAll("button");

buttons.forEach(btn=>{

if(
btn.innerText.trim()==="+" ||
btn.innerText.trim()==="−"
){

btn.disabled = disable;

btn.style.opacity =
disable ? "0.5" : "1";

btn.style.cursor =
disable
? "not-allowed"
: "pointer";
}
});

const checkoutBtn =
document.querySelector(".order-btn");

checkoutBtn.disabled =
disable;

checkoutBtn.style.opacity =
disable ? "0.5" : "1";

checkoutBtn.style.cursor =
disable
? "not-allowed"
: "pointer";
}

function updateStatus(){

const msg =
document.getElementById(
"statusMsg"
);

if(!isClosed()){

msg.innerText =
"🟢 Open Now";

toggleCart(false);

return;
}

let now = new Date();

let openTime =
new Date();

if(now.getHours() >= 21){

openTime.setDate(
now.getDate()+1
);
}

openTime.setHours(
10,0,0,0
);

let diff =
openTime - now;

let h =
Math.floor(
diff/(1000*60*60)
);

let m =
Math.floor(
(diff%(1000*60*60))
/(1000*60)
);

let s =
Math.floor(
(diff%(1000*60))
/1000
);

msg.innerText =
`🔴 Opens in ${h}h ${m}m ${s}s`;

toggleCart(true);
}

setInterval(updateStatus,1000);

updateStatus();

</script>

</body>
</html>
