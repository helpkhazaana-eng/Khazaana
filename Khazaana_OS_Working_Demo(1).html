const c=document.getElementById('network'),ctx=c.getContext('2d');

(function draw(){
ctx.clearRect(0,0,c.width,c.height);

p.x+=p.vx;p.y+=p.vy;

ctx.fillStyle='#60a5fa';ctx.fillRect(p.x,p.y,2,2);
}

})();

async function loadAnalytics(){

try{

  const snap = await getDocs(
    collection(db,"orders")
  );

  console.log("Orders Found:", snap.size);

  snap.forEach(doc=>{
    console.log(doc.id, doc.data());
  });

  let revenueToday = 0;
  let ordersToday = 0;
  const customers = new Set();
const customerOrders = {};
let pendingOrders = 0;
let deliveredOrders = 0;
let couponUsage = 0;
let codOrders = 0;
  snap.forEach(doc=>{

    const data = doc.data();

    console.log("STATUS =", data.status);;

    customers.add(data.phone);
if(!customerOrders[data.phone]){
   customerOrders[data.phone] = 0;
}

customerOrders[data.phone]++;
const status = (data.status || "").toLowerCase();

if(
status.includes("accepted") ||
status.includes("out for delivery")
){
   pendingOrders++;
}

if(status.includes("delivered")){
   deliveredOrders++;
}
if(data.status === "Delivered"){
   deliveredOrders++;
}

if(data.coupon && data.coupon !== "None"){
   couponUsage++;
}

if(data.payment === "COD"){
   codOrders++;
}

    revenueToday += Number(data.total || 0);
    ordersToday++;

  });

  const aov =
  ordersToday > 0
  ? Math.round(revenueToday/ordersToday)
  : 0;
let newCustomers = 0;
let repeatCustomers = 0;

Object.values(customerOrders).forEach(count=>{

   if(count === 1){
      newCustomers++;
   }else{
      repeatCustomers++;
   }

});
  if(document.getElementById("revToday"))
document.getElementById("revToday").innerText =
"₹" + revenueToday;

if(document.getElementById("ordersToday"))
document.getElementById("ordersToday").innerText =
ordersToday;

if(document.getElementById("customersCount"))
document.getElementById("customersCount").innerText =
customers.size;

if(document.getElementById("aov"))
document.getElementById("aov").innerText =
"₹" + aov;

if(document.getElementById("newCustomers"))
document.getElementById("newCustomers").innerText =
newCustomers;

if(document.getElementById("repeatCustomers"))
document.getElementById("repeatCustomers").innerText =
repeatCustomers;
if(document.getElementById("pulseCustomers")){

document.getElementById("pulseCustomers").innerText =
customers.size;

document.getElementById("pulseNew").innerText =
newCustomers;

document.getElementById("pulseRepeat").innerText =
repeatCustomers;

const retention =
customers.size > 0
? Math.round((repeatCustomers/customers.size)*100)
: 0;

document.getElementById("pulseRetention").innerText =
retention + "%";

}
if(document.getElementById("revRevenue")){

document.getElementById("revRevenue").innerText =
"₹" + revenueToday;

document.getElementById("revOrders").innerText =
ordersToday;

document.getElementById("revCustomers").innerText =
customers.size;

document.getElementById("revAov").innerText =
"₹" + aov;

document.getElementById("summaryRevenue").innerText =
"₹" + revenueToday;

document.getElementById("summaryOrders").innerText =
ordersToday;

document.getElementById("summaryCustomers").innerText =
customers.size;

}

if(document.getElementById("pendingOrders")){

document.getElementById("pendingOrders").innerText =
pendingOrders;

document.getElementById("deliveredOrders").innerText =
deliveredOrders;

document.getElementById("couponUsage").innerText =
couponUsage;

document.getElementById("codOrders").innerText =
codOrders;

}

if(document.getElementById("aiCustomerInsight")){

let customerText =
repeatCustomers > 0
? `⭐ ${repeatCustomers} repeat customers detected`
: `⭐ Most customers are first-time buyers`;

document.getElementById("aiCustomerInsight").innerText =
customerText;

}

if(document.getElementById("aiRevenueInsight")){

let revenueText =
`💰 Average order value is ₹${aov}`;

document.getElementById("aiRevenueInsight").innerText =
revenueText;

}

}catch(err){

  console.error("Analytics Error:", err);

}

}
