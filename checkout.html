<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif
}

body{
background:
radial-gradient(circle at top,#2d1606 0%,#120904 45%,#050303 100%);
color:#fff;
padding:20px;
min-height:100vh;
}

.slide-order{
    position:relative;
    width:100%;
    height:65px;
    border-radius:40px;
    margin-top:22px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);

    overflow:hidden;
    user-select:none;
}

.slide-text{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:700;
    color:#ffb347;
    letter-spacing:.5px;
}

#sliderBtn{
    position:absolute;
    left:5px;
    top:5px;

    width:55px;
    height:55px;

    border-radius:50%;

    background:linear-gradient(135deg,#ff9a1f,#ff6b00);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
    color:white;
    cursor:pointer;

    transition:.1s;
}

.card{
max-width:620px;
margin:auto;
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:26px;
box-shadow:
0 10px 40px rgba(0,0,0,.45),
inset 0 1px 0 rgba(255,255,255,.06);
}

h2{
text-align:center;
color:#ff9a1f;
margin-bottom:24px;
font-size:34px;
font-weight:800;
letter-spacing:.5px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px dashed rgba(255,255,255,.08);
font-size:15px;
color:#f5f5f5;
}

.item:last-child{
border-bottom:none;
}

hr{
border:none;
height:1px;
background:rgba(255,255,255,.08);
margin:18px 0;
}

input,
textarea{
width:100%;
padding:15px;
margin-top:14px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
outline:none;
font-size:15px;
resize:none;
background:rgba(255,255,255,.04);
color:#fff;
transition:.25s;
}

input::placeholder,
textarea::placeholder{
color:#b8b8b8;
}

input:focus,
textarea:focus{
border-color:#ff9a1f;
box-shadow:0 0 0 4px rgba(255,154,31,.12);
}

.btn{
width:100%;
padding:16px;
margin-top:22px;
background:linear-gradient(135deg,#25D366,#1faa52);
color:#fff;
border:none;
border-radius:16px;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.3s;
box-shadow:0 8px 22px rgba(37,211,102,.25);
}

.btn:hover{
transform:translateY(-3px) scale(1.01);
}

.note{
text-align:center;
font-size:12px;
color:#bdbdbd;
margin-top:12px;
}

.total{
color:#ffb347;
font-size:18px;
}

.logo{
text-align:center;
font-size:14px;
color:#ffb347;
margin-bottom:10px;
letter-spacing:3px;
}

.welcome{
text-align:center;
color:#25D366;
font-size:14px;
margin-bottom:18px;
font-weight:600;
}

.party{
animation:pop .8s ease;
}

@keyframes pop{

0%{
transform:scale(.7);
opacity:0;
}

60%{
transform:scale(1.15);
opacity:1;
}

100%{
transform:scale(1);
}
}

.confetti{

position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
z-index:9999;
animation:blast 1.2s ease forwards;
pointer-events:none;
}

@keyframes blast{

0%{
opacity:0;
transform:translate(-50%,-50%) scale(.3);
}

30%{
opacity:1;
transform:translate(-50%,-50%) scale(1.2);
}

100%{
opacity:0;
transform:translate(-50%,-200%) scale(1.8);
}
}

.coupon-card{

margin-top:14px;
padding:14px 16px;
border-radius:16px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
transition:.25s;
}

.coupon-card:hover{

transform:translateY(-2px);
border-color:#ff9a1f;
}

.coupon-top{

display:flex;
justify-content:space-between;
align-items:center;
}

.coupon-code{

font-size:16px;
font-weight:800;
color:#ffb347;
}

.coupon-desc{

margin-top:5px;
font-size:13px;
color:#cfcfcf;
}

.disabled-coupon{

opacity:.45;
cursor:not-allowed;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("QRt9B91Mf6uBKYR5J");
</script>

</head>

<body>

<div class="card">

<div class="logo" id="restaurantName">
KHAZAANA
</div>

<div class="welcome" id="welcomeText"></div>

<h2>
Confirm Your Order
</h2>

<div id="orderSummary"></div>

<input
id="name"
placeholder="Your Name *">

<input
id="phone"
type="tel"
maxlength="10"
placeholder="Phone Number *">

<textarea
id="address"
rows="4"
placeholder="Enter Full Delivery Address *"></textarea>

<div id="couponList"></div>

<input
id="coupon"
placeholder="Tap a coupon below or enter manually">

<button
class="btn"
style="margin-top:12px;background:linear-gradient(135deg,#ff9a1f,#ff6b00)"
onclick="applyCoupon()">

Apply Coupon

</button>

<div
id="couponMessage"
style="margin-top:12px;font-size:14px;color:#25D366;text-align:center;font-weight:700;">
</div>

<div class="slide-order">
    <div class="slide-text">Slide to Place Order →</div>
    <div id="sliderBtn">➜</div>
</div>

<div class="note">
Please verify your details before ordering
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_UipI_NKsbMWrmqCh26t_L7lBbRRw3GE",
  authDomain: "khazaana-7088c.firebaseapp.com",
  projectId: "khazaana-7088c",
  storageBucket: "khazaana-7088c.firebasestorage.app",
  messagingSenderId: "988898941531",
  appId: "1:988898941531:web:851a3d3db24c85e9fa3d7e"
};

const app = initializeApp(firebaseConfig);

window.db = getFirestore(app);
window.collection = collection;
window.addDoc = addDoc;
window.query = query;
window.where = where;
window.getDocs = getDocs;

</script>

<script>

const PHONE = "918695902696";

const order =
JSON.parse(
localStorage.getItem("khazaanaOrder")
);

if(!order){

alert("No order found");

window.location.href = "index.html";
}

document.getElementById(
"restaurantName"
).innerText =
order.restaurant;

const savedName =
localStorage.getItem("kh_name");

const savedPhone =
localStorage.getItem("kh_phone");

const savedAddress =
localStorage.getItem("kh_address");

if(savedName){

document.getElementById("welcomeText")
.innerText =
"Welcome back 👋 " + savedName;
}

document.getElementById("name").value =
savedName || "";

document.getElementById("phone").value =
savedPhone || "";

document.getElementById("address").value =
savedAddress || "";

let discount = 0;
let discountType = "flat";
let appliedCoupon = "";
let originalDelivery = order.delivery;

const box =
document.getElementById("orderSummary");

function renderOrder(){

box.innerHTML = "";

order.items.forEach(i=>{

box.innerHTML += `
<div class="item">
<span>${i.name} x${i.qty}</span>
<span>₹${i.total}</span>
</div>
`;

});

box.innerHTML += `

<hr>

<div class="item">
<b>Subtotal</b>
<b>₹${order.subtotal}</b>
</div>

<div class="item">
<b>Delivery</b>
<b>
${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
</b>
</div>

${discount > 0 ? `
<div class="item" style="color:#25D366">
<b>Quiz Discount</b>
${
discountType === "percent"
? `<b>- ₹${Math.round((order.subtotal * discount)/100)}</b>`
: `<b>- ₹${discount}</b>`
}

</div>
` : ""}

<div class="item total">
<b>Total</b>
<b>₹${order.total}</b>
</div>

`;

}

renderOrder();
updateTotal();
const couponList =
document.getElementById("couponList");

function loadCoupons(){

let html = "";

html += `
<div
class="coupon-card"
onclick="selectCoupon('KHAZAANA5')">

<div class="coupon-top">

<div class="coupon-code">
KHAZAANA5
</div>

<div>
🎉
</div>

</div>

<div class="coupon-desc">
5% OFF on orders above ₹350
</div>

</div>
`;

if(
order.restaurant
.toUpperCase()
.includes("CUPS N CRUMBS")
){

html += `
<div
class="coupon-card"
onclick="selectCoupon('CUPSNCRUMBSCAFE10')">

<div class="coupon-top">

<div class="coupon-code">
CUPSNCRUMBSCAFE10
</div>

<div>
☕
</div>

</div>

<div class="coupon-desc">
10% OFF above ₹400
</div>

</div>
`;

}else{

html += `
<div
class="coupon-card disabled-coupon">

<div class="coupon-top">

<div class="coupon-code">
CUPSNCRUMBSCAFE10
</div>

<div>
🔒
</div>

</div>

<div class="coupon-desc">
10% OFF only for Cups N Crumbs Cafe
</div>

</div>
`;
}

couponList.innerHTML = html;

}

loadCoupons();

function selectCoupon(code){

document.getElementById("coupon")
.value = code;

applyCoupon();

}

function showCelebration(){

const pop =
document.createElement("div");

pop.className = "confetti";

pop.innerHTML = "🎉✨🎊";

document.body.appendChild(pop);

setTimeout(()=>{

pop.remove();

},1200);

const msgBox =
document.getElementById("couponMessage");

msgBox.classList.add("party");

setTimeout(()=>{

msgBox.classList.remove("party");

},800);

}

async function applyCoupon(){

const code =
document.getElementById("coupon")
.value
.trim()
.toUpperCase();

const msgBox =
document.getElementById("couponMessage");

discount = 0;
appliedCoupon = "";
order.delivery = originalDelivery;

if(code === "KHAZAANA5"){

    if(order.subtotal >= 350){

        discount = 5;
discountType = "percent";
        appliedCoupon = code;

        msgBox.innerText =
        "✅ KHAZAANA5 Applied — 5% OFF";

        showCelebration();

    }else{

        msgBox.innerText =
        "❌ Minimum order ₹350 required";

        updateTotal();
        return;
    }

}

else if(code === "CUPSNCRUMBSCAFE10"){

    if(
    order.restaurant
    .toUpperCase()
    .includes("CUPS N CRUMBS")
    ){

        if(order.subtotal >= 400){

            discount = 10;
discountType = "percent";
            appliedCoupon = code;

            msgBox.innerText =
            "✅ CUPSNCRUMBSCAFE10 Applied — ₹10 %";

            showCelebration();

        }else{

            msgBox.innerText =
            "❌ Minimum order ₹400 required";

            updateTotal();
            return;
        }

    }else{

        msgBox.innerText =
        "❌ Only for Cups N Crumbs Cafe";

        updateTotal();
        return;
    }

}

else{

    const couponQuery = window.query(
    window.collection(window.db,"challengeCoupons"),
    window.where("coupon","==",code),
    window.where("used","==",false)
);

    const snap = await window.getDocs(couponQuery);

    if(!snap.empty){

        const data = snap.docs[0].data();

        discount = data.discount;
discountType = "flat";
        appliedCoupon = code;

        msgBox.innerText =
        `✅ Quiz Coupon Applied - ₹${data.discount} OFF`;

        showCelebration();

    }else{

        msgBox.innerText =
        "❌ Invalid Coupon";

        updateTotal();
        return;
    }
}

updateTotal();

}

function updateTotal(){

    let finalSubtotal = order.subtotal;

    if(discount > 0){

        if(discountType === "percent"){

            finalSubtotal =
            order.subtotal -
            ((order.subtotal * discount)/100);

        }else{

            finalSubtotal =
            order.subtotal - discount;

        }

    }

   order.total =
Math.round(finalSubtotal + order.delivery);

renderOrder();

}


async function finalOrder(){
const name =
document.getElementById("name")
.value.trim();

const phone =
document.getElementById("phone")
.value.trim();

const address =
document.getElementById("address")
.value.trim();

if(!name || !phone || !address){

alert("Please enter all details");

return;

}

if(phone.length !== 10){

alert("Please enter valid mobile number");

return;

}

/* SAVE USER */

localStorage.setItem(
"kh_name",
name
);

localStorage.setItem(
"kh_phone",
phone
);

localStorage.setItem(
"kh_address",
address
);

/* SEND ORDER TO BACKEND */

fetch(
"https://khazaana-bozo.onrender.com/place-order",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

customer:name,

phone:phone,

address:address,

items:order.items,

subtotal:order.subtotal,

delivery:order.delivery,

total:order.total,

payment:"COD",

restaurant:order.restaurant,

coupon:appliedCoupon || "None"

})

}

)
.then(res=>res.json())
.then(data=>{

console.log(data);

})
.catch(err=>{

console.log(err);

});

try {

const response = await emailjs.send(
  "service_0x788xa",
  "template_utyr3rw",
  {
    order_id: Date.now(),
    restaurant_name: order.restaurant,
    customer_name: name,
    customer_phone: phone,
    customer_address: address,
coupon_used: appliedCoupon || "None",
    order_items: order.items.map(i =>
      `${i.name} x${i.qty} - ₹${i.total}`
    ).join("\n"),
    order_total: order.total
  }
);

console.log("Email sent", response);

} catch(err) {

  console.error("EMAIL ERROR:", err);

}

const docRef = await window.addDoc(

  window.collection(window.db,"orders"),
  {
    customer:name,
    phone:phone,
    address:address,
    items:order.items,
    subtotal:order.subtotal,
    delivery:order.delivery,
    total:order.total,
    restaurant:order.restaurant,
    coupon:appliedCoupon || "None",
    payment:"COD",
    status:"Pending",
    date:new Date().toISOString(),

    feedbackSubmitted:false,
    foodRating:0,
    deliveryRating:0
}

);

fetch("https://script.google.com/macros/s/AKfycbzJUhvTP1Fc7D0hP035sa4l5vqzjrX_7e9jFaeAc47kM9MyN7tlfuhB9HFOs6aEaWhV/exec", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    orderId: docRef.id,
    name: name,
    phone: phone,
    items: order.items.map(i =>
      `${i.name} x${i.qty}`
    ).join(", "),
    total: order.total,
    status: "Pending"
  })
});


localStorage.setItem(
  "activeOrder",
  docRef.id
);

localStorage.setItem("lastCustomerName", name);
localStorage.setItem("lastAddress", address);
localStorage.setItem("lastRestaurant", order.restaurant);
localStorage.setItem(
  "lastItems",
  order.items.map(i => `${i.name} x${i.qty}`).join(", ")
);

localStorage.removeItem(
  "khazaanaOrder"
);

window.location.href =
"track-order.html?id=" +
docRef.id;


}

const slider =
document.getElementById("sliderBtn");

const container =
document.querySelector(".slide-order");

let dragging = false;

slider.addEventListener("mousedown", () => {
    dragging = true;
});

document.addEventListener("mousemove", (e) => {

    if (!dragging) return;

    const rect = container.getBoundingClientRect();

    let x = e.clientX - rect.left - 27;

    const max = rect.width - 60;

    if (x < 0) x = 0;
    if (x > max) x = max;

    slider.style.left = x + "px";
});

document.addEventListener("mouseup", () => {

    if (!dragging) return;

    dragging = false;

    const rect = container.getBoundingClientRect();

    const max = rect.width - 60;

    const current =
    parseInt(slider.style.left || 0);

    if (current > max * 0.85) {

        slider.innerHTML = "✓";
        slider.style.background = "#25D366";

        finalOrder();

    } else {

        slider.style.left = "5px";

    }

});

slider.addEventListener("touchstart",()=>{
    dragging=true;
});

document.addEventListener("touchmove",(e)=>{

    if(!dragging) return;

    const rect = container.getBoundingClientRect();

    let x =
    e.touches[0].clientX -
    rect.left - 27;

    const max = rect.width - 60;

    if(x < 0) x = 0;
    if(x > max) x = max;

    slider.style.left = x + "px";
});

document.addEventListener("touchend",()=>{

    if(!dragging) return;

    dragging=false;

    const rect = container.getBoundingClientRect();

    const max = rect.width - 60;

    const current =
    parseInt(slider.style.left || 0);

    if(current > max * 0.85){

        slider.innerHTML = "✓";
        slider.style.background = "#25D366";

        finalOrder();

    }else{

        slider.style.left = "5px";
    }

});

</script>

</body>
</html>
