<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif
}

body{
  background:
    radial-gradient(circle at top,#2d1606 0%,#120904 45%,#050303 100%);
  color:#fff;
  padding:20px;
  min-height:100vh;
}

.card{
  max-width:620px;
  margin:auto;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:26px;
  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.06);
}

h2{
  text-align:center;
  color:#ff9a1f;
  margin-bottom:24px;
  font-size:34px;
  font-weight:800;
  letter-spacing:.5px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px dashed rgba(255,255,255,.08);
  font-size:15px;
  color:#f5f5f5;
}

.item:last-child{
  border-bottom:none;
}

hr{
  border:none;
  height:1px;
  background:rgba(255,255,255,.08);
  margin:18px 0;
}

input,
textarea{
  width:100%;
  padding:15px;
  margin-top:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  outline:none;
  font-size:15px;
  resize:none;
  background:rgba(255,255,255,.04);
  color:#fff;
}

input::placeholder,
textarea::placeholder{
  color:#b8b8b8;
}

.btn{
  width:100%;
  padding:16px;
  margin-top:22px;
  background:linear-gradient(135deg,#25D366,#1faa52);
  color:#fff;
  border:none;
  border-radius:16px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.note{
  text-align:center;
  font-size:12px;
  color:#bdbdbd;
  margin-top:12px;
}

.total{
  color:#ffb347;
  font-size:18px;
}

.logo{
  text-align:center;
  font-size:14px;
  color:#ffb347;
  margin-bottom:10px;
  letter-spacing:3px;
}

.welcome{
  text-align:center;
  color:#25D366;
  font-size:14px;
  margin-bottom:18px;
  font-weight:600;
}

.coupon-card{

  margin-top:14px;
  padding:14px 16px;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer;
}

.coupon-code{

  font-size:16px;
  font-weight:800;
  color:#ffb347;
}

.coupon-desc{

  margin-top:5px;
  font-size:13px;
  color:#cfcfcf;
}

</style>
</head>

<body>

<div class="card">

  <div class="logo" id="restaurantName">
    KHAZAANA
  </div>

  <div class="welcome" id="welcomeText"></div>

  <h2>
    Confirm Your Order
  </h2>

  <div id="orderSummary"></div>

  <input
    id="name"
    placeholder="Your Name *">

  <input
    id="phone"
    type="tel"
    maxlength="10"
    placeholder="Phone Number *">

  <textarea
    id="address"
    rows="4"
    placeholder="Enter Full Delivery Address *"></textarea>

  <div id="couponList"></div>

  <input
    id="coupon"
    placeholder="Tap coupon or enter manually">

  <button
    class="btn"
    style="margin-top:12px;background:linear-gradient(135deg,#ff9a1f,#ff6b00)"
    onclick="applyCoupon()">

    Apply Coupon

  </button>

  <div
    id="couponMessage"
    style="margin-top:12px;font-size:14px;color:#25D366;text-align:center;font-weight:700;">
  </div>

  <button
    class="btn"
    onclick="finalOrder()">

    Final Order on WhatsApp

  </button>

  <div class="note">
    Please verify your details before ordering
  </div>

</div>

<script>

const PHONE = "918695902696";

const order =
JSON.parse(
localStorage.getItem("khazaanaOrder")
);

if(!order){

  alert("No order found");

  window.location.href = "index.html";
}

document.getElementById(
"restaurantName"
).innerText =
order.restaurant;

const savedName =
localStorage.getItem("kh_name");

const savedPhone =
localStorage.getItem("kh_phone");

const savedAddress =
localStorage.getItem("kh_address");

if(savedName){

  document.getElementById("welcomeText")
  .innerText =
  "Welcome back 👋 " + savedName;
}

document.getElementById("name").value =
savedName || "";

document.getElementById("phone").value =
savedPhone || "";

document.getElementById("address").value =
savedAddress || "";

let discount = 0;
let appliedCoupon = "";
let originalDelivery = order.delivery;

const box =
document.getElementById("orderSummary");

function renderOrder(){

  box.innerHTML = "";

  order.items.forEach(i=>{

    box.innerHTML += `
    <div class="item">
      <span>${i.name} x${i.qty}</span>
      <span>₹${i.total}</span>
    </div>
    `;

  });

  box.innerHTML += `

  <hr>

  <div class="item">
    <b>Subtotal</b>
    <b>₹${order.subtotal}</b>
  </div>

  <div class="item">
    <b>Delivery</b>
    <b>
    ${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
    </b>
  </div>

  ${discount > 0 ? `
  <div class="item" style="color:#25D366">
    <b>Discount (${discount}%)</b>
    <b>- ₹${Math.round((order.subtotal * discount)/100)}</b>
  </div>
  ` : ""}

  <div class="item total">
    <b>Total</b>
    <b>₹${order.total}</b>
  </div>

  `;
}

renderOrder();

const couponList =
document.getElementById("couponList");

couponList.innerHTML = `

<div
class="coupon-card"
onclick="selectCoupon('KHAZAANA5')">

<div class="coupon-code">
KHAZAANA5
</div>

<div class="coupon-desc">
5% OFF on orders above ₹350
</div>

</div>

`;

function selectCoupon(code){

  document.getElementById("coupon")
  .value = code;

  applyCoupon();
}

function applyCoupon(){

  const code =
  document.getElementById("coupon")
  .value
  .trim()
  .toUpperCase();

  const msgBox =
  document.getElementById("couponMessage");

  discount = 0;
  appliedCoupon = "";
  order.delivery = originalDelivery;

  if(code === "KHAZAANA5"){

    if(order.subtotal >= 350){

      discount = 5;
      appliedCoupon = code;

      msgBox.innerText =
      "✅ KHAZAANA5 Applied";

    }else{

      msgBox.innerText =
      "❌ Minimum order ₹350 required";

      updateTotal();

      return;
    }

  }else{

    msgBox.innerText =
    "❌ Invalid Coupon";

    updateTotal();

    return;
  }

  updateTotal();
}

function updateTotal(){

  let finalSubtotal =
  order.subtotal;

  if(discount > 0){

    finalSubtotal =
    order.subtotal -
    ((order.subtotal * discount)/100);
  }

  order.total =
  Math.round(finalSubtotal + order.delivery);

  renderOrder();
}

function finalOrder(){

  const name =
  document.getElementById("name")
  .value.trim();

  const phone =
  document.getElementById("phone")
  .value.trim();

  const address =
  document.getElementById("address")
  .value.trim();

  if(!name || !phone || !address){

    alert("Please enter all details");

    return;
  }

  if(!/^[6-9]\d{9}$/.test(phone)){

    alert(
    "Please enter valid mobile number"
    );

    return;
  }

  localStorage.setItem(
    "kh_name",
    name
  );

  localStorage.setItem(
    "kh_phone",
    phone
  );

  localStorage.setItem(
    "kh_address",
    address
  );

  let items = "";

  order.items.forEach(i=>{

    items +=
`${i.name} x${i.qty} = ₹${i.total}\n`;

  });

  let msg =
`Hello 👋

Order from *${order.restaurant}*

Name: ${name}
Phone: ${phone}
Address: ${address}

${items}

Subtotal: ₹${order.subtotal}
Delivery: ${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
Coupon: ${appliedCoupon || "None"}
Total: ₹${order.total}

📞 8695902696 / 8649851034
`;

  const whatsappURL =
  "https://wa.me/" +
  PHONE +
  "?text=" +
  encodeURIComponent(msg);

  window.location.href =
  whatsappURL;

}

</script>

</body>
</html>
