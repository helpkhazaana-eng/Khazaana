<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
:root{--green:#0b3d2e;--green2:#0f513d;--white:#fff;--muted:#b8c7c1;--line:rgba(255,255,255,.10)}
body{min-height:100vh;padding:24px;background:linear-gradient(145deg,#071f18,#0b3d2e 48%,#061b15);color:#fff}
.card{width:min(680px,100%);margin:auto;padding:30px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(20px);box-shadow:0 24px 70px rgba(0,0,0,.38)}
.logo{text-align:center;font-size:13px;letter-spacing:4px;font-weight:800;color:#fff;margin-bottom:8px}
.welcome{text-align:center;color:#dce9e4;font-size:13px;margin-bottom:18px}
h2{text-align:center;font-size:30px;margin-bottom:25px;color:#fff}
.section-title{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#dce9e4;margin:24px 0 10px;font-weight:800}
.section{padding:17px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:20px}
.item{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.item:last-child{border-bottom:0}
.item b{color:#fff}
hr{border:0;height:1px;background:var(--line);margin:13px 0}
.total{font-size:20px!important}
input,textarea{width:100%;margin-top:10px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.055);color:#fff;outline:0;font-size:15px}
input::placeholder,textarea::placeholder{color:#aebdb7}
input:focus,textarea:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.savings{margin-top:14px;display:grid;gap:9px}
.saving{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:13px;color:#e7f1ed}
.saving strong{color:#fff}
.saving.unlocked{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.10)}
.more-btn{width:100%;margin-top:12px;padding:13px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.coupon-card{margin-top:10px;padding:14px 15px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--line);cursor:pointer}
.coupon-card:hover{border-color:rgba(255,255,255,.35)}
.coupon-top{display:flex;justify-content:space-between;align-items:center}
.coupon-code{font-weight:800;color:#fff}
.coupon-desc{margin-top:5px;font-size:13px;color:var(--muted)}
.disabled-coupon{opacity:.45;cursor:not-allowed}
.apply{width:100%;padding:14px;margin-top:10px;background:#fff;color:#0b3d2e;border:0;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer}
.coupon-msg{text-align:center;margin-top:10px;font-size:13px;font-weight:700;min-height:18px}
.payment{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045)}
.payment-dot{width:10px;height:10px;border-radius:50%;background:#fff}
.payment small{display:block;color:var(--muted);margin-top:3px}
.slide-order{position:relative;width:100%;height:64px;border-radius:36px;margin-top:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);overflow:hidden;user-select:none}
.slide-text{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;letter-spacing:.3px}
#sliderBtn{touch-action:none;-webkit-user-select:none;user-select:none;position:absolute;left:5px;top:5px;width:54px;height:54px;border-radius:50%;background:#fff;color:#0b3d2e;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.1s}
.note{text-align:center;font-size:12px;color:#9fb0aa;margin-top:11px}
.confetti{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;z-index:9999;animation:blast 1.2s ease forwards;pointer-events:none}
@keyframes blast{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-200%) scale(1.8)}}
.party{animation:pop .8s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}

.recommendations{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec-card{padding:12px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(255,255,255,.045)}
.rec-name{font-weight:800;font-size:14px;line-height:1.25}
.rec-price{margin-top:5px;font-size:13px;color:#c9d8d2}
.rec-add{width:100%;margin-top:10px;padding:9px;border:1px solid rgba(255,255,255,.18);border-radius:11px;background:#fff;color:#0b3d2e;font-weight:800;cursor:pointer}
.rec-added{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.25)}
@media(max-width:420px){.recommendations{grid-template-columns:1fr}}

@media(max-width:600px){body{padding:12px}.card{padding:21px;border-radius:22px}h2{font-size:26px}}

<body>
<div class="card">
  <div class="logo" id="restaurantName">KHAZAANA</div>
  <div class="welcome" id="welcomeText"></div>

<div class="section">

    <div class="coupon-card" onclick="selectCoupon('KHAZAANA5')">

        <div class="coupon-code">KHAZAANA5</div>

      </div>
      <div class="coupon-desc">
        5% OFF on orders above ₹350
      </div>

    <div id="cncCouponCard"
         class="coupon-card"
         onclick="selectCoupon('CUPSNCRUMBSCAFE10')">
      <div class="coupon-top">
        <div class="coupon-code">CUPSNCRUMBSCAFE10</div>
        <div>☕</div>
      </div>
      <div class="coupon-desc">
        10% OFF above ₹400 · Cups N Crumbs only
      </div>
    </div>

  </div>

  <input
    id="coupon"
    autocomplete="off"
    autocorrect="off"

  <button class="apply" onclick="applyCoupon()">
    Apply Coupon

  <div id="couponMessage" class="coupon-msg"></div>

</div>

<div class="section-title">04 · Payment</div>
  <div class="section">
    <div class="payment">
      <div class="payment-dot"></div>
      <div><b>Cash on Delivery</b><small>Pay when your order arrives</small></div>
    </div>
  </div>

  <div class="section-title">05 · Place Order</div>
  <div class="section">
    <div class="place-order-wrap">
  <button type="button" id="whatsappOrderBtn" class="whatsapp-order-btn" onclick="finalOrder()">
    <span class="whatsapp-order-icon"><i class="fa-brands fa-whatsapp"></i></span>
    <span class="whatsapp-order-text">Place Order on WhatsApp</span>
    <span class="whatsapp-order-arrow">→</span>
  </button>
</div>
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  updateDoc,
  increment
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_UipI_NKsbMWrmqCh26t_L7lBbRRw3GE",
  authDomain: "khazaana-7088c.firebaseapp.com",
  projectId: "khazaana-7088c",
  storageBucket: "khazaana-7088c.firebasestorage.app",
  messagingSenderId: "988898941531",
  appId: "1:988898941531:web:851a3d3db24c85e9fa3d7e"
};

const app = initializeApp(firebaseConfig);

window.db = getFirestore(app);

updateDoc(
  doc(window.db,"analytics","stats"),
  {
    checkoutStarted: increment(1)
  }
).catch(console.error);

window.addDoc = addDoc;
window.collection = collection;

/* ADD THESE 3 LINES */
window.doc = doc;
window.updateDoc = updateDoc;
window.increment = increment;

</script><script>

const PHONE = "918695902696";

const order =
JSON.parse(
localStorage.getItem("khazaanaOrder")
);
window.order = order;
loadCoupons();

if(typeof gtag === "function"){
  gtag('event','checkout_started',{
    restaurant:order.restaurant
  });
}

if(!order){

alert("No order found");

window.location.href = "index.html";
}

document.getElementById(
"restaurantName"
).innerText =
order.restaurant;
const savedName =
localStorage.getItem("kh_name");

const savedPhone =
localStorage.getItem("kh_phone");

const savedAddress =
localStorage.getItem("kh_address");

if(savedName){

document.getElementById("welcomeText")
.innerText =
"Welcome back 👋 " + savedName;
}

document.getElementById("name").value =
savedName || "";

document.getElementById("phone").value =
savedPhone || "";

document.getElementById("address").value =
savedAddress || "";

let discount = 0;
let discountType = "flat";
let appliedCoupon = "";
let originalDelivery = order.delivery;

const box =
document.getElementById("orderSummary");

function renderOrder(){

box.innerHTML = "";

order.items.forEach(i=>{

box.innerHTML += `
<div class="item">
<span>${i.name} x${i.qty}</span>
<span>₹${i.total}</span>
</div>
`;

});

box.innerHTML += `

<hr>

<div class="item">
<b>Subtotal</b>
<b>₹${order.subtotal}</b>
</div>

<div class="item">
<b>Delivery</b>
<b>
${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
</b>
</div>

${discount > 0 ? `
<div class="item" style="color:#25D366">
<b>Discount</b>
<b>- ₹${discountType === "percent"
  ? Math.round((order.subtotal * discount)/100)
  : discount}</b>
</div>
` : ""}

<div class="item total">
<b>Total</b>
<b>₹${order.total}</b>
</div>

`;

}

syncDeliveryCharge();
renderOrder();
updateTotal();
const couponList =
document.getElementById("couponList");

function loadCoupons(){

  const card=document.getElementById("cncCouponCard");
  if(!card) return;

  const restaurant =
    String(order && order.restaurant ? order.restaurant : "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"");

  /* CUPSNCRUMBSCAFE10 is visible ONLY for Cups N Crumbs. */
  card.style.display =
    restaurant.includes("CUPSNCRUMBS")
      ? "block"
      : "none";
}


function selectCoupon(code){

document.getElementById("coupon")
.value = code;

applyCoupon();

}

function showCelebration(){

const pop =
document.createElement("div");

pop.className = "confetti";

pop.innerHTML = "🎉✨🎊";

document.body.appendChild(pop);

setTimeout(()=>{

pop.remove();

},1200);

const msgBox =
document.getElementById("couponMessage");

msgBox.classList.add("party");

setTimeout(()=>{

msgBox.classList.remove("party");

},800);

}

async function applyCoupon(){

  const code =
    document.getElementById("coupon")
      .value
      .trim()
      .toUpperCase();

  const msgBox = document.getElementById("couponMessage");

  discount = 0;
  appliedCoupon = "";

  /* Always restore the restaurant-specific delivery charge first. */
  syncDeliveryCharge();

  if(code === "KHAZAANA5"){

    if(order.subtotal >= 350){

      discount = 5;
      discountType = "percent";
      appliedCoupon = code;

      msgBox.innerText =
        "✅ KHAZAANA5 Applied — 5% OFF";

      showCelebration();

    }else{

      msgBox.innerText =
        "❌ Minimum order ₹350 required";

      updateTotal();
      return;
    }

  }else if(code === "CUPSNCRUMBSCAFE10"){

    /* STRICT: this coupon works only for Cups N Crumbs Café. */
    if(
      !String(order.restaurant || "")
        .toUpperCase()
        .includes("CUPS N CRUMBS")
    ){

      msgBox.innerText =
        "❌ This coupon is only valid at Cups N Crumbs Café";

      updateTotal();
      return;
    }

    if(order.subtotal >= 400){

      discount = 10;
      discountType = "percent";
      appliedCoupon = code;

      msgBox.innerText =
        "☕ CUPSNCRUMBSCAFE10 Applied — 10% OFF";

      showCelebration();

    }else{

      msgBox.innerText =
        "❌ Minimum order ₹400 required";

      updateTotal();
      return;
    }

  }else{

    msgBox.innerText =
      "❌ Invalid coupon code";

    updateTotal();
    return;
  }

  updateTotal();
}
function updateTotal(){

    syncDeliveryCharge();

    let finalSubtotal = order.subtotal;

    if(discount > 0){

        if(discountType === "percent"){

            finalSubtotal =
            order.subtotal -
            ((order.subtotal * discount)/100);

        }else{

            finalSubtotal =
            order.subtotal - discount;

        }

    }

   order.total =
Math.round(finalSubtotal + order.delivery);

renderOrder();

}


async function finalOrder(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(!name || !phone || !address){
    alert("Please enter all details");
    return;
  }

  if(!/^\d{10}$/.test(phone)){
    alert("Please enter valid mobile number");
    return;
  }

  /*
    Open a WhatsApp tab immediately from the customer's click.
    This prevents the browser from blocking the WhatsApp tab later.
  */
  let waWindow = null;

  try{
    waWindow = window.open("about:blank","_blank");
  }catch(e){
    console.warn("WhatsApp tab blocked:",e);
  }

  try{

    if(!window.addDoc || !window.collection || !window.db){
      throw new Error("Firebase order system is not ready.");
    }

    /* Create the REAL Firestore order first.
       The Firestore document ID becomes the tracking ID. */
    const docRef = await window.addDoc(
      window.collection(window.db,"orders"),
      {
        customer:name,
        phone:phone,
        address:address,
        items:order.items,
        subtotal:Number(order.subtotal)||0,
        delivery:Number(order.delivery)||0,
        total:Number(order.total)||0,
        restaurant:order.restaurant,
        coupon:appliedCoupon || "None",
        payment:"COD",
        status:"Pending",
        date:new Date().toISOString(),
        feedbackSubmitted:false,
        foodRating:0,
        deliveryRating:0
      }
    );

    const orderId = docRef.id;

    localStorage.setItem("activeOrder",orderId);
    localStorage.setItem("kh_name",name);
    localStorage.setItem("kh_phone",phone);
    localStorage.setItem("kh_address",address);
    localStorage.setItem("lastCustomerName",name);
    localStorage.setItem("lastAddress",address);
    localStorage.setItem("lastRestaurant",order.restaurant);
    localStorage.setItem(
      "lastItems",
      order.items.map(i=>`${i.name} x${i.qty}`).join(", ")
    );

    const whatsappMessage = `🍽️ *NEW ORDER*

👤 Name: ${name}
📞 Phone: ${phone}

🏪 Restaurant: ${order.restaurant}

📦 Items:
${order.items.map(i =>
`• ${i.name} x${i.qty} = ₹${i.total}`
).join("\n")}

💰 Subtotal: ₹${order.subtotal}
🚚 Delivery: ${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
${appliedCoupon ? `🎟️ Coupon: ${appliedCoupon}\n` : ""}💵 *Total: ₹${order.total}*

📍 Address:
${address}

Order ID: ${orderId}`;

    const waUrl =
      "https://wa.me/" +
      PHONE +
      "?text=" +
      encodeURIComponent(whatsappMessage);

    /* Put the completed order into the WhatsApp tab. */
    if(waWindow && !waWindow.closed){
      waWindow.location.href = waUrl;
    }else{
      /* If popup was blocked, try opening it once more. */
      window.open(waUrl,"_blank");
    }

    localStorage.removeItem("khazaanaOrder");

    /*
      THIS is the important part:
      after the order is successfully created, open tracking page
      using the REAL Firestore document ID.
    */
    window.location.href =
      "track-order.html?id=" +
      encodeURIComponent(orderId);

  }catch(error){

    console.error("ORDER CREATION FAILED:",error);

    if(waWindow && !waWindow.closed){
      waWindow.close();
    }

    alert(
      "We couldn't create your order. Please try again."
    );
  }
}

/*
  IMPORTANT:
  Delivery is recalculated from the restaurant's real threshold.
  This prevents a message saying FREE DELIVERY while ₹30 is still charged.
*/
function syncDeliveryCharge(){
  const subtotal = Number(order.subtotal) || 0;

  order.delivery =
    subtotal >= FREE_DELIVERY_THRESHOLD
      ? 0
      : (subtotal > 0 ? 30 : 0);

  return order.delivery;
}

function goBackToMenu(){
  history.back();
}

function updateSavingsMessage(){
  const box=document.getElementById("savingsBox");
  if(!box) return;

  const subtotal=Number(order.subtotal)||0;
  const delivery=syncDeliveryCharge();
  let html="";

  if(subtotal >= FREE_DELIVERY_THRESHOLD){
    html += '<div class="saving unlocked">✓ <strong>FREE DELIVERY UNLOCKED</strong></div>';
  }else{
    const need=FREE_DELIVERY_THRESHOLD-subtotal;
    html += '<div class="saving">🚚 <strong>Add ₹'+need+' more</strong> to unlock <strong>FREE DELIVERY</strong></div>';
  }

  if(subtotal >= KHAZAANA5_THRESHOLD){
    html += '<div class="saving unlocked">✓ <strong>KHAZAANA5 UNLOCKED · 5% OFF</strong></div>';
  }else{
    const need=KHAZAANA5_THRESHOLD-subtotal;
    html += '<div class="saving">🎁 <strong>Add ₹'+need+' more</strong> to unlock <strong>KHAZAANA5 · 5% OFF</strong></div>';
  }

  box.innerHTML=html;

  /* Keep the displayed total consistent with the corrected delivery. */
  updateTotal();
}

/* Fix the order immediately when checkout opens. */
syncDeliveryCharge();

window.addEventListener("load",()=>{
  setTimeout(updateSavingsMessage,150);
  setInterval(updateSavingsMessage,500);
});
</script>
