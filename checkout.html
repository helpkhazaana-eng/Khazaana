let order = null;

try {

  try {
    order.items = JSON.parse(order.items);

    order.items = [];

order.items = order.items.map(i => ({
  name: String(i?.name || "Item"),

  price: Number(i?.price || i?.unitPrice || 0),
  total: Number(i?.total ?? ((Number(i?.price || i?.unitPrice || 0)) * Number(i?.qty || 1)))
}));

/* Always calculate subtotal from the actual items shown in checkout. */
order.subtotal = order.items.reduce(
  (sum, i) => sum + Number(i.total || 0), 0
);

order.total = Math.round(
  order.subtotal + Number(order.delivery || 0)
);

alert("No order found");

window.location.href = "index.html";

"restaurantName"

if(!Array.isArray(order.items) || order.items.length === 0){

async function applyCoupon(){

const code =
document.getElementById("coupon")
.value
.trim()
.toUpperCase();

const msgBox =
document.getElementById("couponMessage");

discount = 0;
appliedCoupon = "";
order.delivery = originalDelivery;

if(code === "KHAZAANA5"){

    if(order.subtotal >= 350){

        discount = 5;
discountType = "percent";
        appliedCoupon = code;

        msgBox.innerText =
        "✅ KHAZAANA5 Applied — 5% OFF";

        showCelebration();

    }else{

        msgBox.innerText =
        "❌ Minimum order ₹350 required";

        updateTotal();
        return;
    }

}

else if(code === "CUPSNCRUMBSCAFE10"){

    if(
    order.restaurant
    .toUpperCase()
    .includes("CUPS N CRUMBS")
    ){

        if(order.subtotal >= 400){

            discount = 10;
discountType = "percent";
            appliedCoupon = code;

            msgBox.innerText =
            "✅ CUPSNCRUMBSCAFE10 Applied — ₹10 %";

            showCelebration();

        }else{

            msgBox.innerText =
            "❌ Minimum order ₹400 required";

            updateTotal();
            return;
        }

    }else{

        msgBox.innerText =
        "❌ Only for Cups N Crumbs Cafe";

        updateTotal();
        return;
    }

}

else{

    const couponQuery = window.query(
    window.collection(window.db,"challengeCoupons"),
    window.where("coupon","==",code),
    window.where("used","==",false)
);

    const snap = await window.getDocs(couponQuery);

   if(!snap.empty){

    const data = snap.docs[0].data();

    let minOrder = 0;

    if(order.restaurant.includes("Cups N Crumbs")){
        minOrder = 300;
    }
    else if(order.restaurant.includes("Khazaana Snacks")){
        minOrder = 350;
    }
    else if(order.restaurant.includes("Khazaana Rasoi")){
        minOrder = 350;
    }
    else if(order.restaurant.includes("Bondhu")){
        minOrder = 400;
    }
    else if(order.restaurant.includes("Haji Biryani")){
        minOrder = 500;
    }

    if(order.subtotal < minOrder){

        msgBox.innerText =
        `❌ Minimum order ₹${minOrder} required for this coupon`;

        updateTotal();
        return;
    }

    discount = data.discount;
    discountType = "flat";
    appliedCoupon = code;

    msgBox.innerText =
    `✅ Quiz Coupon Applied - ₹${data.discount} OFF`;

    showCelebration();

}

else{

        msgBox.innerText =
        "❌ Invalid Coupon";

        updateTotal();
        return;
    }
}

updateTotal();

}

function updateTotal(){

    syncDeliveryCharge();

    let finalSubtotal = order.subtotal;

    if(discount > 0){

        if(discountType === "percent"){

            finalSubtotal =
            order.subtotal -
            ((order.subtotal * discount)/100);

        }else{

            finalSubtotal =
            order.subtotal - discount;

        }

    }

   order.total =
Math.round(finalSubtotal + order.delivery);

renderOrder();

}

const slider =
document.getElementById("sliderBtn");

const container =
document.querySelector(".slide-order");

let dragging = false;

slider.addEventListener("mousedown", () => {
    dragging = true;
});

document.addEventListener("mousemove", (e) => {

    if (!dragging) return;

    const rect = container.getBoundingClientRect();

    let x = e.clientX - rect.left - 27;

    const max = rect.width - 60;

    if (x < 0) x = 0;
    if (x > max) x = max;

    slider.style.left = x + "px";
});

document.addEventListener("mouseup", () => {

    if (!dragging) return;

    dragging = false;

    const rect = container.getBoundingClientRect();

    const max = rect.width - 60;

    const current =
    parseInt(slider.style.left || 0);

    if (current > max * 0.85) {

        slider.innerHTML = "✓";
        slider.style.background = "#25D366";

        finalOrder();

    } else {

        slider.style.left = "5px";

    }

});

slider.addEventListener("touchstart",()=>{
    dragging=true;
});

document.addEventListener("touchmove",(e)=>{

    if(!dragging) return;

    const rect = container.getBoundingClientRect();

    let x =
    e.touches[0].clientX -
    rect.left - 27;

    const max = rect.width - 60;

    if(x < 0) x = 0;
    if(x > max) x = max;

    slider.style.left = x + "px";
});

document.addEventListener("touchend",()=>{

    if(!dragging) return;

    dragging=false;

    const rect = container.getBoundingClientRect();

    const max = rect.width - 60;

    const current =
    parseInt(slider.style.left || 0);

  if(current > max * 0.85){

    slider.innerHTML = "✓";
    slider.style.background = "#25D366";

    finalOrder();

}

});

function getSameRestaurantMenu(){
  const restaurant = String(order.restaurant || "").toUpperCase();
  const key = Object.keys(RESTAURANT_MENUS).find(k => restaurant.includes(k));
  return key ? RESTAURANT_MENUS[key] : [];
}

function recalculateCheckoutOrder(){
  order.subtotal = order.items.reduce(
    (sum,i) => sum + Number(i.total || 0),0
  );

  localStorage.setItem("khazaanaOrder",JSON.stringify(order));

  updateTotal();
  renderOrder();
  renderCheckoutRecommendations();
  updateSavingsMessage();
}

function addCheckoutItem(name,price){
  const existing = order.items.find(i =>
    String(i.name).toLowerCase() === String(name).toLowerCase()
  );

  if(existing){
    existing.qty = Number(existing.qty || 0) + 1;
    existing.total = Number(existing.qty) * Number(existing.price || price);
  }else{
    order.items.push({
      name:name,
      qty:1,
      price:Number(price),
      total:Number(price)
    });
  }

  recalculateCheckoutOrder();
}

function removeCheckoutItem(name){
  const existing = order.items.find(i =>
    String(i.name).toLowerCase() === String(name).toLowerCase()
  );

  if(!existing) return;

  existing.qty = Number(existing.qty || 0) - 1;

  if(existing.qty <= 0){
    order.items = order.items.filter(i =>
      String(i.name).toLowerCase() !== String(name).toLowerCase()
    );
  }else{
    existing.total =
      Number(existing.qty) * Number(existing.price || 0);
  }

  recalculateCheckoutOrder();
}

function renderCheckoutRecommendations(){
  const box=document.getElementById("recommendationBox");
  if(!box) return;

  const menu=getSameRestaurantMenu();

  if(!menu.length){
    box.innerHTML="";
    return;
  }

  /* Keep added items visible so they can be removed again. */
  const available=menu.slice(0,4);

  if(!available.length){
    box.innerHTML="";
    return;
  }

  box.innerHTML=`
    <div class="section-title" style="margin-top:18px">
      Add More From ${order.restaurant}
    </div>

    <div style="font-size:13px;color:#b8c7c1;margin-bottom:10px">
      Add directly to your current order
    </div>

    <div class="recommendations">
      ${available.map(x=>`
        <div class="rec-card">
          <div class="rec-name">${x[0]}</div>
          <div class="rec-price">₹${x[1]}</div>
          <button class="rec-add"
            onclick='addCheckoutItem(${JSON.stringify(x[0])},${Number(x[1])})'>
            + Add
          </button>

          <button class="rec-remove"
            onclick='removeCheckoutItem(${JSON.stringify(x[0])})'>
            − Remove
          </button>
        </div>
      `).join("")}
    </div>
  `;
}

window.addEventListener("load",()=>{
  setTimeout(renderCheckoutRecommendations,100);
  setTimeout(updateSavingsMessage,150);
});

setInterval(()=>{
  renderCheckoutRecommendations();
  updateSavingsMessage();
},700);
</script>

<script>
/* ================= RESTAURANT-SPECIFIC CHECKOUT LOGIC ================= */
const KHAZAANA5_THRESHOLD = 350;

function getFreeDeliveryThreshold(restaurantName){
  const name = String(restaurantName || "").toUpperCase();

  if(name.includes("CUPS N CRUMBS")) return 250;
  if(name.includes("ARSALAN")) return 500;
  if(name.includes("HAZI") || name.includes("KOLKATA HAZI")) return 500;
  if(name.includes("BONDHU")) return 450;
  if(name.includes("SNACKS CORNER")) return 250;
  if(name.includes("KHAZAANA RASOI")) return 300;
  if(name.includes("CAKE ZONE") || name.includes("CAKEZONE")) return 350;

  /* Safe fallback only if a restaurant has not been configured yet. */
  return 250;
}

const FREE_DELIVERY_THRESHOLD =
  getFreeDeliveryThreshold(order.restaurant);

/*
  IMPORTANT:
  Delivery is recalculated from the restaurant's real threshold.
  This prevents a message saying FREE DELIVERY while ₹30 is still charged.
*/
function syncDeliveryCharge(){
  const subtotal = Number(order.subtotal) || 0;

  order.delivery =
    subtotal >= FREE_DELIVERY_THRESHOLD
      ? 0
      : (subtotal > 0 ? 30 : 0);

  return order.delivery;
}

function goBackToMenu(){
  history.back();
}

function updateSavingsMessage(){
  const box=document.getElementById("savingsBox");
  if(!box) return;

  const subtotal=Number(order.subtotal)||0;
  const delivery=syncDeliveryCharge();
  let html="";

  if(subtotal >= FREE_DELIVERY_THRESHOLD){
    html += '<div class="saving unlocked">✓ <strong>FREE DELIVERY UNLOCKED</strong></div>';
  }else{
    const need=FREE_DELIVERY_THRESHOLD-subtotal;
    html += '<div class="saving">🚚 <strong>Add ₹'+need+' more</strong> to unlock <strong>FREE DELIVERY</strong></div>';
  }

  if(subtotal >= KHAZAANA5_THRESHOLD){
    html += '<div class="saving unlocked">✓ <strong>KHAZAANA5 UNLOCKED · 5% OFF</strong></div>';
  }else{
    const need=KHAZAANA5_THRESHOLD-subtotal;
    html += '<div class="saving">🎁 <strong>Add ₹'+need+' more</strong> to unlock <strong>KHAZAANA5 · 5% OFF</strong></div>';
  }

  box.innerHTML=html;

  /* Keep the displayed total consistent with the corrected delivery. */
  updateTotal();
}

/* Fix the order immediately when checkout opens. */
syncDeliveryCharge();

window.addEventListener("load",()=>{
  setTimeout(updateSavingsMessage,150);
  setInterval(updateSavingsMessage,500);
});
</script>
