<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif
}

body{
  background:
    radial-gradient(circle at top,#2d1606 0%,#120904 45%,#050303 100%);
  color:#fff;
  padding:20px;
  min-height:100vh;
}

.card{
  max-width:620px;
  margin:auto;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:26px;
  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.06);
}

h2{
  text-align:center;
  color:#ff9a1f;
  margin-bottom:24px;
  font-size:34px;
  font-weight:800;
  letter-spacing:.5px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px dashed rgba(255,255,255,.08);
  font-size:15px;
  color:#f5f5f5;
}

.item:last-child{
  border-bottom:none;
}

hr{
  border:none;
  height:1px;
  background:rgba(255,255,255,.08);
  margin:18px 0;
}

input,
textarea{
  width:100%;
  padding:15px;
  margin-top:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  outline:none;
  font-size:15px;
  resize:none;
  background:rgba(255,255,255,.04);
  color:#fff;
  transition:.25s;
}

input::placeholder,
textarea::placeholder{
  color:#b8b8b8;
}

input:focus,
textarea:focus{
  border-color:#ff9a1f;
  box-shadow:0 0 0 4px rgba(255,154,31,.12);
}

.btn{
  width:100%;
  padding:16px;
  margin-top:22px;
  background:linear-gradient(135deg,#25D366,#1faa52);
  color:#fff;
  border:none;
  border-radius:16px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 8px 22px rgba(37,211,102,.25);
}

.btn:hover{
  transform:translateY(-3px) scale(1.01);
}

.note{
  text-align:center;
  font-size:12px;
  color:#bdbdbd;
  margin-top:12px;
}

.total{
  color:#ffb347;
  font-size:18px;
}

.logo{
  text-align:center;
  font-size:14px;
  color:#ffb347;
  margin-bottom:10px;
  letter-spacing:3px;
}

</style>
</head>

<body>

<div class="card">

  <div class="logo">
    KHAZAANA
  </div>

  <h2>
    Confirm Your Order
  </h2>

  <div id="orderSummary"></div>

  <input
    id="name"
    placeholder="Your Name *">

  <input
    id="phone"
    type="tel"
    maxlength="10"
    placeholder="Phone Number *">

  <textarea
    id="address"
    rows="4"
    placeholder="Enter Full Delivery Address *"></textarea>

  <button
    class="btn"
    onclick="finalOrder()">

    Final Order on WhatsApp

  </button>

  <div class="note">
    Please verify your details before ordering
  </div>

</div>

<script>

const PHONE = "918695902696";

const order =
  JSON.parse(
    localStorage.getItem("khazaanaOrder")
  );

if(!order){

  alert("No order found");

  window.location.href = "index.html";
}

const box =
  document.getElementById("orderSummary");

/* ORDER ITEMS */

order.items.forEach(i=>{

  box.innerHTML += `
    <div class="item">
      <span>${i.name} x${i.qty}</span>
      <span>₹${i.total}</span>
    </div>
  `;

});

/* TOTALS */

box.innerHTML += `

<hr>

<div class="item">
  <b>Subtotal</b>
  <b>₹${order.subtotal}</b>
</div>

<div class="item">
  <b>Delivery</b>
  <b>
    ${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
  </b>
</div>

<div class="item total">
  <b>Total</b>
  <b>₹${order.total}</b>
</div>

`;

/* FINAL ORDER */

function finalOrder(){

  const name =
    document.getElementById("name")
    .value.trim();

  const phone =
    document.getElementById("phone")
    .value.trim();

  const address =
    document.getElementById("address")
    .value.trim();

  if(!name || !phone || !address){

    alert("Please enter all details");

    return;
  }

  if(phone.length !== 10){

    alert("Enter valid phone number");

    return;
  }

  let msg =
`Hello 👋

Order from *${order.restaurant}*

Name: ${name}
Phone: ${phone}
Address: ${address}

`;

  order.items.forEach(i=>{

    msg +=
`${i.name} x${i.qty} = ₹${i.total}\n`;

  });

  msg += `

Subtotal: ₹${order.subtotal}
Delivery: ${order.delivery === 0 ? "FREE" : "₹" + order.delivery}
Total: ₹${order.total}

`;

  window.location.href =
    "https://api.whatsapp.com/send?phone=" +
    PHONE +
    "&text=" +
    encodeURIComponent(msg);
}

</script>

</body>
</html>
