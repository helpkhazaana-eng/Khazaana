<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cups N Crumbs Café | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon-180x180.png">

<style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

/* ================= BODY ================= */

body{

  background:

  linear-gradient(
  180deg,
  #0f0b08 0%,
  #16110d 35%,
  #1b140f 65%,
  #120d09 100%
  );

  color:#fff;

  overflow-x:hidden;

  padding-bottom:140px;
}

/* ================= NAVBAR ================= */

.glass-navbar{

  position:sticky;

  top:0;

  z-index:1000;

  background:
  rgba(10,10,10,.45);

  backdrop-filter:blur(18px);

  border-bottom:
  1px solid rgba(255,255,255,.06);

  box-shadow:
  0 10px 30px rgba(0,0,0,.18);
}

.nav{

  max-width:1200px;

  margin:auto;

  padding:16px 24px;

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.logo{

  font-size:24px;

  font-weight:800;

  color:#fff;

  text-shadow:
  0 0 18px rgba(255,122,0,.25);
}

.nav-links{

  display:flex;

  gap:28px;
}

.nav-links a{

  position:relative;

  text-decoration:none;

  color:
  rgba(255,255,255,.72);

  font-weight:500;

  transition:.3s ease;
}

.nav-links a:hover{

  color:#ff8c1a;
}

.nav-links a::after{

  content:'';

  position:absolute;

  left:0;

  bottom:-8px;

  width:0;

  height:2px;

  border-radius:999px;

  background:
  linear-gradient(
  90deg,
  #ff7a00,
  #ff5400
  );

  transition:.35s ease;
}

.nav-links a:hover::after{

  width:100%;
}

/* ================= HERO ================= */

.hero{

  text-align:center;

  padding:70px 20px 50px;

  position:relative;
}

.hero::before{

  content:'';

  position:absolute;

  inset:0;

  background:

  radial-gradient(
  circle at top right,
  rgba(255,122,0,.12),
  transparent 30%
  );

  pointer-events:none;
}

.hero h1{

  position:relative;

  z-index:2;

  font-size:58px;

  font-weight:900;

  letter-spacing:-2px;

  margin-bottom:14px;

  color:#fff;
}

.hero p{

  position:relative;

  z-index:2;

  color:
  rgba(255,255,255,.72);

  font-size:17px;
}

#statusMsg{

  margin-top:14px;

  font-weight:700;

  color:#ffb347;
}

/* ================= MENU ================= */

.menu{

  max-width:1400px;

  margin:auto;

  padding:20px 24px 90px;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:28px;
}

/* ================= SECTION ================= */

.section{

  background:
  rgba(255,255,255,.06);

  border:
  1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:24px;

  box-shadow:
  0 20px 45px rgba(0,0,0,.25);

  transition:.35s ease;
}

.section:hover{

  transform:
  translateY(-8px);

  box-shadow:
  0 30px 65px rgba(0,0,0,.35);
}

.section h2{

  font-size:22px;

  margin-bottom:18px;

  color:#ffb347;
}

/* ================= ITEM ================= */

.item{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:14px 0;

  border-bottom:
  1px dashed rgba(255,255,255,.08);
}

.item:last-child{

  border-bottom:none;
}

.item span{

  color:#fff;

  font-size:15px;

  line-height:1.5;
}

/* ================= CONTROLS ================= */

.controls{

  display:flex;

  align-items:center;

  gap:8px;
}

.btn{

  width:30px;

  height:30px;

  border:none;

  border-radius:10px;

  background:
  linear-gradient(
  135deg,
  #ff7a00,
  #ff5400
  );

  color:#fff;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s ease;
}

.btn:hover{

  transform:scale(1.08);
}

.qty{

  min-width:22px;

  text-align:center;

  font-weight:700;

  color:#fff;
}

/* ================= CART ================= */

.cart-bar{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  background:
  rgba(10,10,10,.92);

  backdrop-filter:blur(18px);

  border-top:
  1px solid rgba(255,255,255,.08);

  box-shadow:
  0 -10px 30px rgba(0,0,0,.35);

  padding:16px 20px;

  z-index:1000;
}

.cart-info{

  font-size:15px;

  margin-bottom:10px;

  color:
  rgba(255,255,255,.75);
}

.cart-info b{

  color:#ffb347;
}

.order-btn{

  width:100%;

  padding:15px;

  border:none;

  border-radius:14px;

  background:
  linear-gradient(
  135deg,
  #25D366,
  #1faa52
  );

  color:#fff;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  transition:.35s ease;
}

.order-btn:hover{

  transform:
  translateY(-3px);
}

.note{

  font-size:12px;

  color:
  rgba(255,255,255,.5);

  text-align:center;

  margin-top:8px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .glass-navbar{

    position:fixed;

    width:100%;
  }

  .nav{

    padding:14px 18px;
  }

  .nav-links{

    gap:16px;
  }

  .hero{

    padding:120px 20px 40px;
  }

  .hero h1{

    font-size:40px;

    line-height:1.1;
  }

  .hero p{

    font-size:15px;
  }

  .menu{

    grid-template-columns:1fr;

    padding:20px 18px 90px;

    gap:22px;
  }

  .section{

    padding:20px;
  }

  .section h2{

    font-size:20px;
  }

  .item span{

    font-size:14px;
  }

}

</style>
</head>

<body>

<header class="glass-navbar">

  <div class="nav">

    <div class="logo">
      Khazaana
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
    </div>

  </div>

</header>

<section class="hero">

  <h1>
    Cups N Crumbs Café
  </h1>

  <p>
    Café • Snacks • Beverages
  </p>

  <p id="statusMsg"></p>

</section>

<section class="menu" id="menu"></section>

<div class="cart-bar">

  <div class="cart-info" id="cartInfo">
    Subtotal: ₹0 | Delivery: ₹0 | <b>Total: ₹0</b>
  </div>

  <button class="order-btn"
          onclick="goToCheckout()">

    Proceed to Checkout

  </button>

  <div class="note">
    Minimum order ₹100 (excluding delivery)
  </div>

</div>

<script>

const DELIVERY=30,
FREE_DELIVERY_ABOVE=250;

const menuData = {

  "☕ Beverages": [
    ["Small Tea",10],
    ["Large Tea",15],
    ["Malai Tea",20],
    ["Coffee",15],
    ["Cold Coffee",90]
  ],

  "🥤 Milkshakes": [
    ["Chocolate",90],
    ["Strawberry",90]
  ],

  "🥐 Patties": [
    ["Veg Patties",50],
    ["Chicken Patties",60]
  ],

  "🍞 Toast Specials": [
    ["Classic Toast",20],
    ["Butter Toast",25],
    ["Cheese Toast",40],
    ["French Toast",70],
    ["Egg Toast",40]
  ],

  "🍝 Pasta": [
    ["Mac & Cheese",60],
    ["Tomato Pasta",50]
  ],

  "🍔 Burgers": [
    ["Veg Burger",70],
    ["Chicken Burger",90]
  ],

"❤️ Love At First Bite": [

  ["Chicken Chatpata",70],
  ["Melted Choco Bliss",70],
  ["Golden Chicken Crisp",110]
  
],
  "🥪 Grill Sandwich": [
    ["Paneer Grill",70],
    ["Chicken Grill",90],
    ["Chicken Tandoori",110]
  ],

  "🍜 Maggi": [
    ["Classic",35],
    ["Peri Peri",40],
    ["Cheese",50]
  ],

  "🧇 Waffles": [
    ["Chocolate",70]
  ],

  "🥞 Pancakes": [
    ["Honey",60],
    ["Chocolate",80]
  ],

  "🍕 Pizza": [
    ["Classic Cheese Pizza",110],
    ["Classic Onion Pizza",120],
    ["Paneer Delight Pizza",120],
    ["Paneer Loaded Pizza",160],
    ["Chicken Delight Pizza",160],
    ["Fusion Pizza",190]
  ],

  "🍟 Fries": [
    ["Salted Fries",50],
    ["Peri Peri Fries",60]
  ],

  "🍹 Mocktails": [
    ["Blue Lagoon",90],
    ["Virgin Mojito",90],
    ["Kala Khatta",90]
  ],

  "🍨 Ice Cream": [
    ["Chocolate",50],
    ["Vanilla",50],
    ["Strawberry",50]
  ]
};

const cart = {};

function renderMenu(){

  const menu =
    document.getElementById("menu");

  for(const section in menuData){

    let html =
    `<div class="section">
      <h2>${section}</h2>`;

    menuData[section].forEach(([name,price],i)=>{

      const id =
        section.replace(/\W/g,'')+i;

      cart[id] = {
        name,
        price,
        qty:0
      };

      html += `
      <div class="item">

        <span>
          ${name} ₹${price}
        </span>

        <div class="controls">

          <button class="btn"
            onclick="updateQty('${id}',-1)">
            −
          </button>

          <span class="qty"
            id="q-${id}">
            0
          </span>

          <button class="btn"
            onclick="updateQty('${id}',1)">
            +
          </button>

        </div>

      </div>`;
    });

    html += `</div>`;

    menu.innerHTML += html;
  }
}

renderMenu();

function updateQty(id,change){

  cart[id].qty =
    Math.max(0,cart[id].qty+change);

  document.getElementById(
    "q-"+id
  ).innerText = cart[id].qty;

  updateTotals();
}

function updateTotals(){

  let subtotal = 0;

  for(const i in cart){

    subtotal +=
      cart[i].qty * cart[i].price;
  }

  let delivery =
    subtotal >= FREE_DELIVERY_ABOVE
    ? 0
    : (subtotal === 0 ? 0 : DELIVERY);

  let total =
    subtotal + delivery;

  document.getElementById(
    "cartInfo"
  ).innerHTML =

  `Subtotal: ₹${subtotal}
  | Delivery:
  ${delivery===0&&subtotal>0
  ?"FREE":"₹"+delivery}
  | <b>Total: ₹${total}</b>`;
}

function goToCheckout(){

  const selectedItems = [];

  let subtotal = 0;

  for(const id in cart){

    if(cart[id].qty > 0){

      selectedItems.push({
        name: cart[id].name,
        price: cart[id].price,
        qty: cart[id].qty
      });

      subtotal += cart[id].price * cart[id].qty;
    }
  }

  if(selectedItems.length === 0){

    alert("Please add items first");
    return;
  }

  localStorage.setItem(
    "checkoutCart",
    JSON.stringify(selectedItems)
  );

  localStorage.setItem(
    "checkoutSubtotal",
    subtotal
  );

  window.location.href = "checkout.html";
}


/* STATUS */

function isClosed(){

  const h =
    new Date().getHours();

  return(h>=21 || h<10);
}


function toggleCart(disable){

  const buttons =
  document.querySelectorAll("button");

  buttons.forEach(btn=>{

    if(
      btn.innerText.trim()==="+" ||
      btn.innerText.trim()==="−"
    ){

      btn.disabled = disable;

      btn.style.opacity =
      disable ? "0.5" : "1";

      btn.style.cursor =
      disable
      ? "not-allowed"
      : "pointer";
    }
  });

  const checkoutBtn =
  document.querySelector(".order-btn");

  checkoutBtn.disabled = disable;

  checkoutBtn.style.opacity =
  disable ? "0.5" : "1";

  checkoutBtn.style.cursor =
  disable
  ? "not-allowed"
  : "pointer";
}

function updateStatus(){

  const msg =
    document.getElementById("statusMsg");

 if(!isClosed()){

  msg.innerText =
    "🟢 Open Now";

  toggleCart(false);

  return;
}

  let now = new Date();

  let open = new Date();

  if(now.getHours()>=21){

    open.setDate(now.getDate()+1);
  }

  open.setHours(10,0,0,0);

  let diff = open-now;

  let h =
    Math.floor(diff/3600000);

  let m =
    Math.floor((diff%3600000)/60000);

  let s =
    Math.floor((diff%60000)/1000);

  msg.innerText =
    msg.innerText =
`🔴 Opens in ${h}h ${m}m ${s}s`;

toggleCart(true);
}

setInterval(updateStatus,1000);

updateStatus();

</script>

</body>
</html>
