<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KOLKATA ARSALAN BIRYANI | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon-180x180.png">

<style>

:root{
  --moss:#2D3A2F;
  --moss-deep:#243026;
  --wheat:#D3C6B6;
  --wheat-light:#E2D8CB;
  --cream:#F4EEE5;
  --line:rgba(211,198,182,.16);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
}

html,body{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:hidden!important;
}

body{
  background:var(--wheat);
  color:var(--moss);
  padding-bottom:145px;
}

/* NAVBAR */
.glass-navbar{
  position:sticky;
  top:0;
  z-index:1000;
  width:100%;
  background:rgba(45,58,47,.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(211,198,182,.18);
  box-shadow:0 12px 35px rgba(45,58,47,.16);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:600;
  letter-spacing:.5px;
  color:var(--wheat-light);
  text-shadow:none;
}

.nav-links{
  display:flex;
  gap:28px;
}

.nav-links a{
  position:relative;
  text-decoration:none;
  color:rgba(226,216,203,.72);
  font-size:13px;
  font-weight:600;
  transition:.3s ease;
}

.nav-links a:hover{
  color:var(--wheat-light);
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-8px;
  width:0;
  height:1px;
  border-radius:0;
  background:var(--wheat-light);
  transition:.35s ease;
}

.nav-links a:hover::after{
  width:100%;
}

/* HERO */
.hero{
  position:relative;
  text-align:center;
  padding:82px 20px 62px;
  background:var(--wheat);
  color:var(--moss);
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:none;
  pointer-events:none;
}

.hero h1{
  position:relative;
  z-index:2;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(40px,6vw,68px);
  font-weight:400;
  letter-spacing:-2px;
  line-height:1;
  margin-bottom:18px;
  color:var(--moss);
}

.hero p{
  position:relative;
  z-index:2;
  color:rgba(45,58,47,.62);
  font-size:15px;
  letter-spacing:1.5px;
}

#statusMsg{
  margin-top:16px;
  color:var(--moss);
  font-size:13px;
  font-weight:700;
}

/* MENU */
.menu{
  width:100%;
  max-width:1150px;
  margin:auto;
  padding:28px 24px 95px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:22px;
}

/* SECTION */
.section{
  background:var(--moss);
  border:1px solid rgba(211,198,182,.15);
  border-radius:0;
  padding:28px;
  box-shadow:0 18px 45px rgba(45,58,47,.13);
  transition:transform .3s ease,box-shadow .3s ease;
}

.section:hover{
  transform:translateY(-4px);
  box-shadow:0 25px 55px rgba(45,58,47,.18);
}

.section h2{
  margin-bottom:18px;
  color:var(--wheat-light);
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:400;
  letter-spacing:.2px;
}

/* ITEMS */
.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.item:last-child{
  border-bottom:none;
}

.item span{
  color:rgba(226,216,203,.92);
  font-size:14px;
  line-height:1.5;
}

/* CONTROLS */
.controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.btn{
  width:32px;
  height:32px;
  border:none;
  border-radius:50%;
  background:var(--wheat-light);
  color:var(--moss);
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

.btn:hover{
  transform:scale(1.08);
  background:var(--cream);
}

.qty{
  min-width:24px;
  text-align:center;
  font-weight:700;
  color:var(--wheat-light);
}

/* CART */
.cart-bar{
  position:fixed;
  left:0;
  bottom:0;
  z-index:9999;
  width:100%;
  padding:16px 20px;
  background:rgba(45,58,47,.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(211,198,182,.18);
  box-shadow:0 -12px 35px rgba(45,58,47,.2);
}

.cart-info{
  margin-bottom:10px;
  text-align:center;
  color:rgba(226,216,203,.72);
  font-size:14px;
}

.cart-info b{
  color:var(--wheat-light);
}

.order-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:2px;
  background:var(--wheat-light);
  color:var(--moss);
  font-size:15px;
  font-weight:800;
  letter-spacing:.5px;
  cursor:pointer;
  transition:.25s ease;
}

.order-btn:hover{
  transform:translateY(-2px);
  background:var(--cream);
}

/* MOBILE */
@media(max-width:768px){
  .glass-navbar{
    position:fixed;
    width:100%;
  }

  .nav{
    padding:14px 18px;
  }

  .logo{
    font-size:20px;
  }

  .nav-links{
    gap:16px;
  }

  .nav-links a{
    font-size:11px;
  }

  .hero{
    padding:112px 20px 42px;
  }

  .hero h1{
    font-size:40px;
    line-height:1.05;
  }

  .hero p{
    font-size:13px;
  }

  .menu{
    grid-template-columns:1fr;
    padding:20px 16px 95px;
    gap:16px;
  }

  .section{
    padding:20px;
  }

  .section h2{
    font-size:21px;
  }

  .item span{
    font-size:13px;
  }

  .btn{
    width:30px;
    height:30px;
  }
}

/* HORIZONTAL STABILITY */
img,svg,video,iframe,canvas{
  max-width:100%;
}

header,section,main,footer,nav,
.menu,.section,.item,.cart-bar{
  min-width:0;
  max-width:100%;
}


/* ================= CHECKOUT SAVINGS POPUP ================= */
.checkout-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(45,58,47,.58);backdrop-filter:blur(10px)}
.checkout-overlay.show{display:flex!important}
.checkout-popup{width:min(430px,100%);padding:28px;background:var(--moss);color:var(--wheat-light);border:1px solid rgba(211,198,182,.22);border-radius:16px;box-shadow:0 30px 90px rgba(45,58,47,.35)}
.checkout-popup h3{margin:0 0 7px;font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;color:var(--wheat-light)}
.checkout-popup-sub{margin-bottom:20px;color:rgba(226,216,203,.65);font-size:13px}
.checkout-save{padding:15px;margin:10px 0;border:1px solid rgba(211,198,182,.13);border-radius:12px;background:rgba(211,198,182,.055)}
.checkout-save.unlocked{border-color:rgba(211,198,182,.30);background:rgba(211,198,182,.10)}
.checkout-save .save-title{font-weight:800;font-size:15px}
.checkout-save .save-detail{margin-top:5px;font-size:12px;color:rgba(226,216,203,.62)}
.checkout-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.checkout-actions button{min-height:48px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px}
.checkout-add-more{border:1px solid rgba(211,198,182,.28);background:transparent;color:var(--wheat-light)}
.checkout-continue{border:0;background:var(--wheat-light);color:var(--moss)}
@media(max-width:480px){.checkout-popup{padding:23px}.checkout-actions{grid-template-columns:1fr}}

</style>
</head>

<body>

<header class="glass-navbar">

<div class="nav">

<div class="logo">
Khazaana
</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="restaurants.html">Restaurants</a>
</div>

</div>

</header>

<section class="hero">

<h1>
KOLKATA ARSALAN BIRYANI
</h1>

<p>
Biryani • Kolkata Style
</p>

<p id="statusMsg"></p>

</section>

<section class="menu" id="menu"></section>

<div class="cart-bar">

<div class="cart-info" id="cartInfo">
Subtotal: ₹0 | Delivery: ₹0 | <b>Total: ₹0</b>
</div>

<button class="order-btn"
onclick="goToCheckout(); return false;">

Proceed to Checkout

</button>

</div>


<!-- CHECKOUT SAVINGS DECISION -->
<div class="checkout-overlay" id="checkoutOverlay" onclick="closeCheckoutPopup(event)">
  <div class="checkout-popup" role="dialog" aria-modal="true">
    <h3>Before you checkout…</h3>
    <div class="checkout-popup-sub">Your Kolkata Arsalan Biryani order can still unlock extra savings.</div>
    <div class="checkout-save" id="freeDeliverySave">
      <div class="save-title" id="freeDeliveryTitle"></div>
      <div class="save-detail" id="freeDeliveryDetail"></div>
    </div>
    <div class="checkout-save" id="couponSave">
      <div class="save-title" id="couponTitle"></div>
      <div class="save-detail" id="couponDetail"></div>
    </div>
    <div class="checkout-actions">
      <button type="button" class="checkout-add-more" onclick="addMoreFromPopup()">＋ Add More</button>
      <button type="button" class="checkout-continue" onclick="continueToCheckout()">Continue to Checkout →</button>
    </div>
  </div>
</div>
<script>

const DELIVERY_FEE = 30;
const MIN_ORDER_VALUE = 200;

function vibrate(ms=30){
if(navigator.vibrate)
navigator.vibrate(ms);
}

const menuData = {

"🍚 Main Course – Biryani":[

["Chicken Biryani (Full)",135],
["Chicken Biryani (Half)",115],
["Aloo Biryani (Full)",100],
["Aloo Biryani (Half)",70],
["Special Chicken Biryani",190],
["Extra Chicken (1 Piece)",70],
["Extra Potato (1 Piece)",10]

]

};

const cart = {};

function renderMenu(){

const menu =
document.getElementById("menu");

for(const section in menuData){

let html =
`<div class="section">

<h2>${section}</h2>`;

menuData[section].forEach(([name,price],i)=>{

const id =
section.replace(/\W/g,'') + i;

cart[id] = {
name,
price,
qty:0
};

html += `

<div class="item">

<span>
${name} ₹${price}
</span>

<div class="controls">

<button class="btn"
onclick="vibrate(20);updateQty('${id}',-1)">
−
</button>

<span class="qty"
id="q-${id}">
0
</span>

<button class="btn"
onclick="vibrate(30);updateQty('${id}',1)">
+
</button>

</div>

</div>

`;
});

html += `</div>`;

menu.innerHTML += html;
}
}

renderMenu();

if(typeof gtag === "function"){
  gtag('event','menu_view',{
    restaurant:'KOLKATA ARSALAN BIRYANI'
  });
}

function updateQty(id,change){

if(change > 0){

  if(typeof gtag === "function"){
    gtag('event','add_to_cart',{
      restaurant:'KOLKATA ARSALAN BIRYANI'
    });
  }

}

cart[id].qty =
Math.max(0, cart[id].qty + change);

document.getElementById(
"q-"+id
).innerText = cart[id].qty;

updateTotals();
}

function updateTotals(){

let subtotal = 0;

for(const i in cart){

  subtotal += cart[i].qty * cart[i].price;

}


let delivery =
subtotal >= 500
? 0
: (subtotal === 0 ? 0 : DELIVERY_FEE);

let total =
subtotal + delivery;

document.getElementById(
"cartInfo"
).innerHTML =

`Subtotal: ₹${subtotal}
| Delivery:
${delivery === 0 && subtotal > 0
? "FREE"
: "₹"+delivery}
| <b>Total: ₹${total}</b>`;
}

function getCurrentSubtotal(){
  let subtotal=0;
  for(const id in cart) subtotal += cart[id].qty * cart[id].price;
  return subtotal;
}

function openCheckoutPopup(){
  const subtotal=getCurrentSubtotal();

  /* Kolkata Arsalan Biryani: FREE DELIVERY at ₹500 */
  const freeThreshold=500;

  /* Common Khazaana coupon: KHAZAANA5 at ₹350 for 5% OFF */
  const couponThreshold=350;

  const freeBox=document.getElementById("freeDeliverySave");
  const freeTitle=document.getElementById("freeDeliveryTitle");
  const freeDetail=document.getElementById("freeDeliveryDetail");
  const couponBox=document.getElementById("couponSave");
  const couponTitle=document.getElementById("couponTitle");
  const couponDetail=document.getElementById("couponDetail");

  if(subtotal>=freeThreshold){
    freeBox.classList.add("unlocked");
    freeTitle.innerText="✓ FREE DELIVERY UNLOCKED";
    freeDetail.innerText="Your Arsalan order already qualifies for free delivery.";
  }else{
    freeBox.classList.remove("unlocked");
    freeTitle.innerText="🚚 Add ₹"+(freeThreshold-subtotal)+" more for FREE DELIVERY";
    freeDetail.innerText="Free delivery starts at ₹500.";
  }

  if(subtotal>=couponThreshold){
    couponBox.classList.add("unlocked");
    couponTitle.innerText="✓ KHAZAANA5 UNLOCKED";
    couponDetail.innerText="Apply KHAZAANA5 in checkout for 5% OFF.";
  }else{
    couponBox.classList.remove("unlocked");
    couponTitle.innerText="🎁 Add ₹"+(couponThreshold-subtotal)+" more for KHAZAANA5";
    couponDetail.innerText="Reach ₹350 to unlock 5% OFF.";
  }

  document.getElementById("checkoutOverlay").classList.add("show");
}

function closeCheckoutPopup(event){
  if(event && event.target!==document.getElementById("checkoutOverlay")) return;
  document.getElementById("checkoutOverlay").classList.remove("show");
}

function addMoreFromPopup(){
  document.getElementById("checkoutOverlay").classList.remove("show");
}

function continueToCheckout(){
  const items=[];
  let subtotal=0;

  for(const i in cart){
    if(cart[i].qty>0){
      const itemTotal=cart[i].qty*cart[i].price;

      items.push({
        name:cart[i].name,
        qty:cart[i].qty,
        price:cart[i].price,
        total:itemTotal
      });

      subtotal+=itemTotal;
    }
  }

  const delivery=subtotal>=500 ? 0 : (subtotal===0 ? 0 : DELIVERY_FEE);

  const orderData={
    restaurant:"KOLKATA ARSALAN BIRYANI",
    items:items,
    subtotal:subtotal,
    delivery:delivery,
    total:subtotal+delivery
  };

  localStorage.setItem("khazaanaOrder",JSON.stringify(orderData));
  window.location.href="checkout.html";
}

function goToCheckout(){
  let subtotal=0;
  let hasInvalidQuantity=false;

  for(const i in cart){
    if(cart[i].qty>0 && cart[i].qty<2){
      hasInvalidQuantity=true;
      break;
    }
  }

  if(hasInvalidQuantity){
    alert("Minimum order quantity is 2 plates per item.");
    return;
  }

  subtotal=getCurrentSubtotal();

  if(subtotal<MIN_ORDER_VALUE){
    alert("Minimum order value is ₹200");
    return;
  }

  openCheckoutPopup();
}

/* STATUS — always open */
function isClosed(){
  return false;
}

function toggleCart(disable){
  const buttons=document.querySelectorAll("button");

  buttons.forEach(btn=>{
    if(btn.innerText.trim()==="+" || btn.innerText.trim()==="−"){
      btn.disabled=false;
      btn.style.opacity="1";
      btn.style.cursor="pointer";
    }
  });

  const checkoutBtn=document.querySelector(".order-btn");
  if(checkoutBtn){
    checkoutBtn.disabled=false;
    checkoutBtn.style.opacity="1";
    checkoutBtn.style.cursor="pointer";
  }
}

function updateStatus(){
  const msg=document.getElementById("statusMsg");
  if(msg) msg.innerText="🟢 Open Now";
  toggleCart(false);
}

updateStatus();

</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  doc,
  updateDoc,
  increment
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyB_UipI_NKsbMWrmqCh26t_L7lBbRRw3GE",
 authDomain: "khazaana-7088c.firebaseapp.com",
 projectId: "khazaana-7088c",
 storageBucket: "khazaana-7088c.firebasestorage.app",
 messagingSenderId: "988898941531",
 appId: "1:988898941531:web:851a3d3db24c85e9fa3d7e"
};

window.analyticsDb =
getFirestore(
  initializeApp(firebaseConfig,"haziAnalytics")
);

window.trackAddToCart = () =>
updateDoc(
  doc(window.analyticsDb,"analytics","stats"),
  {
    addToCart: increment(1)
  }
).catch(console.error);

</script>
</body>
</html>
