<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Khazaana Rasoi | Khazaana</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">

<style>

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:
  linear-gradient(
  180deg,
  #0f0b08 0%,
  #16110d 35%,
  #1b140f 65%,
  #120d09 100%
  );

  color:#fff;
  overflow-x:hidden;
  padding-bottom:140px;
}

/* ================= NAVBAR ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  background:
  rgba(10,10,10,.45);

  backdrop-filter:blur(18px);

  border-bottom:
  1px solid rgba(255,255,255,.06);

  box-shadow:
  0 10px 30px rgba(0,0,0,.18);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 24px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#fff;
}

.nav a{
  text-decoration:none;
  margin-left:24px;

  color:
  rgba(255,255,255,.72);

  font-weight:500;

  transition:.3s ease;
}

.nav a:hover{
  color:#ff8c1a;
}

/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:70px 20px 40px;
  position:relative;
}

.hero::before{
  content:'';
  position:absolute;
  inset:0;

  background:
  radial-gradient(
  circle at top right,
  rgba(255,122,0,.12),
  transparent 30%
  );

  pointer-events:none;
}

.hero h1{
  position:relative;
  z-index:2;

  font-size:58px;
  font-weight:900;

  letter-spacing:-2px;

  margin-bottom:12px;

  color:#fff;
}

.hero p{
  position:relative;
  z-index:2;

  color:
  rgba(255,255,255,.72);

  font-size:17px;
}

.badge{
  display:inline-block;

  margin-top:12px;

  background:
  rgba(255,122,0,.12);

  border:
  1px solid rgba(255,122,0,.18);

  color:#ffb347;

  padding:8px 16px;

  border-radius:999px;

  font-weight:700;

  font-size:14px;
}

#statusMsg{
  margin-top:14px;
  font-weight:700;
  color:#ffb347;
}

/* ================= MENU ================= */

.menu{
  max-width:1200px;
  margin:auto;

  padding:20px 24px 90px;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:28px;
}

.section{
  background:
  rgba(255,255,255,.06);

  border:
  1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  border-radius:28px;

  padding:24px;

  box-shadow:
  0 20px 45px rgba(0,0,0,.25);

  transition:.35s ease;
}

.section:hover{
  transform:
  translateY(-8px);
}

.section h2{
  font-size:22px;
  margin-bottom:18px;
  color:#ffb347;
}

/* ================= ITEM ================= */

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:12px 0;

  border-bottom:
  1px dashed rgba(255,255,255,.08);
}

.item:last-child{
  border-bottom:none;
}

.item span{
  color:#fff;
  font-size:15px;
  line-height:1.5;
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  width:30px;
  height:30px;

  border:none;
  border-radius:10px;

  background:
  linear-gradient(
  135deg,
  #ff7a00,
  #ff5400
  );

  color:#fff;

  font-size:18px;
  font-weight:700;

  cursor:pointer;

  transition:.3s ease;
}

.btn:hover{
  transform:scale(1.08);
}

.qty{
  min-width:22px;
  text-align:center;
  font-weight:700;
  color:#fff;
}

/* ================= CART ================= */

.cart-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;

  background:
  rgba(10,10,10,.92);

  backdrop-filter:blur(18px);

  border-top:
  1px solid rgba(255,255,255,.08);

  padding:16px 20px;

  z-index:9999;
}

.cart-info{
  font-size:14px;
  margin-bottom:10px;

  color:
  rgba(255,255,255,.75);
}

.cart-info b{
  color:#ffb347;
}

.order-btn{
  width:100%;

  padding:15px;

  border:none;

  border-radius:14px;

  background:
  linear-gradient(
  135deg,
  #25D366,
  #1faa52
  );

  color:#fff;

  font-size:16px;
  font-weight:800;

  cursor:pointer;

  transition:.35s ease;
}

.order-btn:hover{
  transform:
  translateY(-3px);
}

.note{
  font-size:12px;

  color:
  rgba(255,255,255,.5);

  text-align:center;

  margin-top:8px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  header{
    position:fixed;
    width:100%;
  }

  .nav{
    padding:14px 18px;
  }

  .hero{
    padding:120px 20px 40px;
  }

  .hero h1{
    font-size:40px;
    line-height:1.1;
  }

  .hero p{
    font-size:15px;
  }

  .menu{
    grid-template-columns:1fr;
    padding:20px 18px 90px;
    gap:22px;
  }

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
Khazaana
</div>

<div>
<a href="index.html">Home</a>
<a href="restaurants.html">Restaurants</a>
</div>

</div>

</header>

<section class="hero">

<h1>
Khazaana Rasoi
</h1>

<p>
Ghorer Moto Ranna
</p>

<p id="statusMsg"></p>

<div class="badge">
🚚 Free delivery on orders above ₹350
</div>

</section>

<section class="menu" id="menu"></section>

<div class="cart-bar">

<div class="cart-info" id="cartInfo">
Subtotal: ₹0 | Delivery: ₹0 | <b>Total: ₹0</b>
</div>

<button class="order-btn"
onclick="goToCheckout()">
Proceed to Checkout
</button>

<div class="note">
Minimum order ₹100 (excluding delivery)
</div>

</div>

<script>

const DELIVERY_FEE = 30;
const FREE_DELIVERY_LIMIT = 350;
const MIN_ORDER = 100;

const menuData = {

  "🍛 Thali": [
    ["Veg Thali",65],
    ["Chicken Thali",160],
    ["Fish Thali",130],
    ["Mutton Thali",260]
  ],

  "🍽 Roti Meals": [
    ["Roti Meal Chicken",110],
    ["Roti Meal Mutton",210]
  ],

  "🍗 Main Dishes": [
    ["Chicken (2 pcs)",85],
    ["Mutton (2 pcs)",190],
    ["Fish (per piece)",50]
  ],

  "🍚 Add-ons": [
    ["Extra Rice",10],
    ["Roti",7]
  ],

  "🍳 Tadka": [
    ["Egg Tadka (Half)",45],
    ["Egg Tadka (Full)",80],
    ["Plain Tadka (Half)",45],
    ["Plain Tadka (Full)",75]
  ]

};

const cart = {};

/* RENDER MENU */

function renderMenu(){

  const menu =
  document.getElementById("menu");

  for(const section in menuData){

    let html =
    `<div class="section">

    <h2>${section}</h2>`;

    menuData[section].forEach(([name,price])=>{

      cart[name] = {
        price,
        qty:0
      };

      html += `

      <div class="item">

        <span>
          ${name} ₹${price}
        </span>

        <div class="controls">

          <button class="btn minus-btn"
          data-id="${name}">
          −
          </button>

          <span class="qty"
          id="q-${name}">
          0
          </span>

          <button class="btn plus-btn"
          data-id="${name}">
          +
          </button>

        </div>

      </div>`;
    });

    html += `</div>`;

    menu.innerHTML += html;
  }
}

renderMenu();

/* BUTTON EVENTS */

document.addEventListener("click",function(e){

  if(e.target.classList.contains("minus-btn")){

    if(isClosed()) return;

    updateQty(
      e.target.dataset.id,
      -1
    );
  }

  if(e.target.classList.contains("plus-btn")){

    if(isClosed()) return;

    updateQty(
      e.target.dataset.id,
      1
    );
  }

});

/* UPDATE QTY */

function updateQty(item,change){

  if(isClosed()) return;

  cart[item].qty =
  Math.max(
  0,
  cart[item].qty + change
  );

  document.getElementById(
  "q-"+item
  ).innerText = cart[item].qty;

  updateTotals();
}

/* TOTALS */

function updateTotals(){

  let subtotal = 0;

  for(const i in cart){

    subtotal +=
    cart[i].qty * cart[i].price;
  }

  const deliveryCharge =
  subtotal >= FREE_DELIVERY_LIMIT
  ? 0
  : (subtotal === 0
    ? 0
    : DELIVERY_FEE);

  const total =
  subtotal + deliveryCharge;

  document.getElementById(
  "cartInfo"
  ).innerHTML =

  `Subtotal: ₹${subtotal}
  | Delivery:
  ${deliveryCharge === 0 && subtotal > 0
  ? "FREE"
  : "₹"+deliveryCharge}
  | <b>Total: ₹${total}</b>`;
}

/* CHECKOUT */

function goToCheckout(){

  if(isClosed()){

    alert(
    "Restaurant is currently closed"
    );

    return;
  }

  let subtotal = 0;

  let items = [];

  for(const i in cart){

    if(cart[i].qty > 0){

      const t =
      cart[i].qty * cart[i].price;

      subtotal += t;

      items.push({

        name:i,

        qty:cart[i].qty,

        price:cart[i].price,

        total:t

      });
    }
  }

  if(subtotal < MIN_ORDER){

    alert(
    "Minimum order ₹100 required"
    );

    return;
  }

  const delivery =
  subtotal >= FREE_DELIVERY_LIMIT
  ? 0
  : DELIVERY_FEE;

  const orderData = {

    restaurant:
    "Khazaana Rasoi",

    items,

    subtotal,

    delivery,

    total:
    subtotal + delivery
  };

  localStorage.setItem(
  "khazaanaOrder",
  JSON.stringify(orderData)
  );

  window.location.href =
  "checkout.html";
}

/* STATUS */

function isClosed(){

  const h =
  new Date().getHours();

  return (h >= 21 || h < 10);
}

/* DISABLE BUTTONS */

function toggleCart(disable){

  const buttons =
  document.querySelectorAll("button");

  buttons.forEach(btn=>{

    if(
      btn.innerText.trim()==="+" ||
      btn.innerText.trim()==="−"
    ){

      btn.disabled = disable;

      btn.style.opacity =
      disable ? "0.5" : "1";

      btn.style.cursor =
      disable
      ? "not-allowed"
      : "pointer";
    }
  });

  const checkoutBtn =
  document.querySelector(".order-btn");

  checkoutBtn.disabled =
  disable;

  checkoutBtn.style.opacity =
  disable ? "0.5" : "1";

  checkoutBtn.style.cursor =
  disable
  ? "not-allowed"
  : "pointer";
}

/* COUNTDOWN */

function updateStatus(){

  const msg =
  document.getElementById(
  "statusMsg"
  );

  if(!isClosed()){

    msg.innerText =
    "🟢 Open Now";

    toggleCart(false);

    return;
  }

  let now =
  new Date();

  let openTime =
  new Date();

  if(now.getHours() >= 21){

    openTime.setDate(
    now.getDate() + 1
    );
  }

  openTime.setHours(
  10,0,0,0
  );

  let diff =
  openTime - now;

  let h =
  Math.floor(
  diff/(1000*60*60)
  );

  let m =
  Math.floor(
  (diff%(1000*60*60))
  /(1000*60)
  );

  let s =
  Math.floor(
  (diff%(1000*60))
  /1000
  );

  msg.innerText =
  `🔴 Opens in ${h}h ${m}m ${s}s`;

  toggleCart(true);
}

setInterval(updateStatus,1000);

updateStatus();

</script>

</script>

</body>
</html>
